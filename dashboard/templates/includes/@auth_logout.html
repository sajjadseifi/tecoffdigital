    <!-- ================= MODAL خروج ================= -->
    <template x-teleport="body">
        <div x-show="logoutModal" 
             class="fixed inset-0 z-[100] flex items-center justify-center p-4 overflow-hidden"
             x-cloak>
            
            <!-- پس‌زمینه بلور و تاریک -->
            <div x-show="logoutModal" 
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 @click="logoutModal = false"
                 class="absolute inset-0 bg-brand-950/60 backdrop-blur-sm"></div>
            
            <!-- کانتینر مودال با طراحی نرم -->
            <div x-show="logoutModal"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 scale-90 translate-y-8"
                 x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100 scale-100 translate-y-0"
                 x-transition:leave-end="opacity-0 scale-90 translate-y-8"
                 class="relative bg-white rounded-[2rem] max-w-sm w-full p-8 shadow-2xl shadow-brand-900/20 border border-brand-100 overflow-hidden">
                
                <!-- افکت نوری پس‌زمینه مودال -->
                <div class="absolute top-0 right-0 w-32 h-32 bg-red-500/5 rounded-full blur-3xl -mr-10 -mt-10 pointer-events-none"></div>

                <div class="text-center relative z-10">
                    <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-red-50 to-red-100 text-red-500 rounded-[1.5rem] mb-6 shadow-inner border border-red-200/50 transform rotate-3">
                        <svg class="w-10 h-10 -rotate-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                        </svg>
                    </div>
                    <h3 class="text-2xl font-black text-brand-950 mb-2">خروج از حساب</h3>
                    <p class="text-brand-500 text-sm leading-relaxed mb-8 font-medium">آیا برای خروج از پیشخوان مدیریت اطمینان دارید؟</p>
                </div>

                <div class="flex gap-3 relative z-10">
                    <button @click="logoutModal = false" class="flex-1 px-5 py-3.5 rounded-2xl bg-brand-50 text-brand-700 font-bold hover:bg-brand-100 transition-all active:scale-95 border border-brand-100">
                        انصراف
                    </button>
                    
                    <form action="{% url 'auth_logout' %}" method="POST" class="flex-1">
                        {% csrf_token %}
                        <button type="submit" class="w-full px-5 py-3.5 rounded-2xl bg-gradient-to-r from-red-500 to-red-600 text-white font-bold hover:from-red-600 hover:to-red-700 transition-all shadow-lg shadow-red-500/20 active:scale-95 border border-red-500">
                            بله، خروج
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </template>
