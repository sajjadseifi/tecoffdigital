<!-- components/category_form.html -->
<div id="category-modal" class="fixed inset-0 z-50 hidden transition-opacity duration-300" role="dialog" aria-modal="true">
    <!-- پس‌زمینه تاریک -->
    <div class="absolute inset-0 bg-brand-900/60 backdrop-blur-sm transition-opacity" onclick="toggleCategoryModal('close')"></div>

    <!-- محتوای مودال -->
    <div class="relative z-10 flex items-center justify-center min-h-screen p-4 sm:p-6">
        <div class="w-full max-w-3xl bg-white rounded-2xl shadow-2xl transform transition-all flex flex-col max-h-[90vh] overflow-hidden">
            
            <form id="category-main-form" method="POST" enctype="multipart/form-data" class="flex flex-col h-full max-h-[90vh] overflow-hidden">
                {% csrf_token %}
                
                <!-- هدر مودال -->
                <div class="flex-shrink-0 flex items-center justify-between px-6 py-4 border-b border-surface-200 bg-surface-50">
                    <h3 id="modal-category-title" class="text-lg font-black text-brand-900">
                        افزودن / ویرایش دسته‌بندی
                    </h3>
                    <button type="button" onclick="toggleCategoryModal('close')" class="p-2 text-brand-400 hover:text-rose-500 hover:bg-rose-50 rounded-xl transition-colors focus:outline-none focus:ring-2 focus:ring-rose-500/20">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>

                <!-- بدنه فرم -->
                <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar bg-white text-right">
                    <!-- بخش تصویر -->
                    <div class="space-y-3 bg-gray-50/50 p-5 rounded-2xl border border-gray-100">
                        <label class="block text-sm font-semibold text-gray-700">تصویر دسته‌بندی</label>
                        {% include 'components/files/image_file_upload.html' %}
                        
                        <!-- پیش‌نمایش تصویر فعلی -->
                        <div id="current-cat-image-preview" class="hidden flex items-center gap-3 mt-3 p-3 bg-white rounded-xl border border-gray-200 shadow-sm">
                            <img id="current-cat-img" src="" class="w-12 h-12 rounded-lg object-cover border border-gray-100 shadow-sm">
                            <div class="flex flex-col">
                                <span class="text-sm font-medium text-gray-700">تصویر فعلی سیستم</span>
                                <span class="text-xs text-gray-400">در صورت آپلود عکس جدید، این تصویر جایگزین می‌شود.</span>
                            </div>
                        </div>
                    </div>                
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="input-cat-title" class="block text-sm font-bold text-brand-700 mb-1.5">عنوان دسته‌بندی <span class="text-rose-500">*</span></label>
                            <input type="text" name="title" id="input-cat-title" required class="w-full px-4 py-2.5 rounded-xl border border-surface-200 focus:border-accent-500 focus:ring-2 focus:ring-accent-500/20 transition-all outline-none text-brand-900 placeholder-brand-300" placeholder="مثال: نوشیدنی‌های گرم">
                        </div>
                        <div>
                            <label for="input-cat-slug" class="block text-sm font-bold text-brand-700 mb-1.5">شناسه (Slug) <span class="text-rose-500">*</span></label>
                            <input type="text" name="slug" id="input-cat-slug" required class="w-full px-4 py-2.5 rounded-xl border border-surface-200 focus:border-accent-500 focus:ring-2 focus:ring-accent-500/20 transition-all outline-none text-brand-900 placeholder-brand-300 font-mono text-left dir-ltr" placeholder="hot-drinks">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="input-cat-order" class="block text-sm font-bold text-brand-700 mb-1.5">ترتیب نمایش</label>
                            <input type="number" name="order" id="input-cat-order" value="0" class="w-full px-4 py-2.5 rounded-xl border border-surface-200 focus:border-accent-500 focus:ring-2 focus:ring-accent-500/20 transition-all outline-none text-brand-900 font-nums">
                        </div>
                        <div class="flex items-center h-full pt-6">
                            <label class="relative inline-flex items-center cursor-pointer group">
                                <input type="checkbox" name="is_active" id="input-cat-active" class="sr-only peer" checked>
                                <div class="w-11 h-6 bg-surface-200 peer-focus:outline-none rounded-full peer peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] after:bg-white after:border-surface-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                                <span class="mr-3 text-sm font-bold text-brand-700 group-hover:text-emerald-600 transition-colors">فعال باشد</span>
                            </label>
                        </div>
                    </div>

                </div>

                <!-- فوتر مودال -->
                <div class="flex-shrink-0 flex items-center justify-end gap-3 px-6 py-4 border-t border-surface-200 bg-surface-50">
                    <button type="button" onclick="toggleCategoryModal('close')" class="px-5 py-2.5 rounded-xl font-bold text-brand-500 hover:bg-surface-200 transition-colors">انصراف</button>
                    <button type="submit" id="modal-cat-submit-btn" class="bg-accent-500 hover:bg-accent-600 text-white px-5 py-2.5 rounded-xl font-bold transition-all shadow-lg shadow-accent-500/30">ذخیره دسته‌بندی</button>
                </div>
            </form>
        </div>
    </div>
</div>
