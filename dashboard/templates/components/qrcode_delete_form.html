<!-- Delete Modal -->
<div id="{{ modal_id|default:'modal-delete-qrcode' }}" tabindex="-1" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-[60] flex justify-center items-center w-full md:inset-0 h-full backdrop-blur-sm bg-surface-900/60 transition-all duration-300">
    <div class="relative p-4 w-full max-w-md max-h-full mx-auto">
        <div class="relative bg-white rounded-3xl shadow-soft border border-surface-200 overflow-hidden">
            <button type="button" class="btn-close-modal absolute top-4 left-4 text-brand-400 bg-transparent hover:bg-surface-200 hover:text-brand-900 rounded-xl text-sm w-8 h-8 inline-flex justify-center items-center transition-colors">
                <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                </svg>
                <span class="sr-only">بستن پنجره</span>
            </button>
            <div class="p-6 md:p-8 text-center">
                <!-- آیکون هشدار -->
                <div class="mx-auto mb-4 text-rose-500 w-16 h-16 bg-rose-50 rounded-full flex items-center justify-center border-4 border-rose-100">
                    <svg class="w-8 h-8" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 11V6m0 8h.01M19 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
                    </svg>
                </div>
                
                <h3 class="mb-2 text-lg font-bold text-brand-900">آیا از حذف این کیوآر کد مطمئن هستید؟</h3>
                <p class="mb-6 text-sm text-brand-500 font-medium">
                    کیوآر کد: <span id="delete-qrcode-name" class="font-bold text-rose-600"></span><br>
                    <span class="text-xs text-brand-400 block mt-2">تصویر این کیوآر کد نیز برای همیشه از سرور پاک خواهد شد و کسانی که آن را اسکن کنند با خطا مواجه می‌شوند.</span>
                </p>
                
                <!-- فرم اکشن حذف -->
                <form id="delete-form-action" method="POST" action="">
                    {% csrf_token %}
                    <div class="flex items-center justify-center gap-3">
                        <button type="button" class="btn-close-modal px-5 py-2.5 text-sm font-bold text-brand-700 bg-surface-100 hover:bg-surface-200 rounded-xl transition-colors">
                            خیر، انصراف
                        </button>
                        <button type="submit" class="px-5 py-2.5 text-sm font-bold text-white bg-rose-500 hover:bg-rose-600 rounded-xl transition-all shadow-lg shadow-rose-500/30">
                            بله، حذف کن
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
