<!-- components/item_delete_form.html -->
<div id="{{ modal_id }}" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-brand-900/50 backdrop-blur-sm transition-opacity" aria-modal="true" role="dialog">
    <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden transform transition-all">
        
        <div class="flex flex-col items-center justify-center p-6 text-center">
            <div class="w-16 h-16 rounded-full bg-rose-100 flex items-center justify-center text-rose-500 mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
            </div>
            
            <h3 class="text-xl font-black text-brand-900 mb-2">حذف آیتم</h3>
            <p class="text-brand-500 text-sm font-medium leading-relaxed">
                آیا از حذف آیتم <span id="delete-item-name" class="font-bold text-brand-900"></span> اطمینان دارید؟<br>
                <span class="text-rose-500 text-xs mt-1 block">این عملیات غیرقابل بازگشت است.</span>
            </p>
        </div>

        <form id="delete-form-action" action="" method="POST">
            {% csrf_token %}
            <div class="flex items-center justify-center gap-3 px-6 py-4 border-t border-surface-200 bg-surface-50">
                <button type="button" class="btn-close-modal px-5 py-2.5 rounded-xl font-bold text-brand-600 bg-white border border-surface-200 hover:bg-surface-50 transition-colors w-full">انصراف</button>
                <button type="submit" class="bg-rose-500 hover:bg-rose-600 text-white px-5 py-2.5 rounded-xl font-bold transition-all shadow-lg shadow-rose-500/30 w-full">بله، حذف شود</button>
            </div>
        </form>
    </div>
</div>
