<div class="bg-surface-50 dark:bg-surface-800 rounded-xl shadow-md border border-surface-200 dark:border-surface-700 p-6 max-w-3xl mx-auto">

    {% csrf_token %}

    <div class="divide-y divide-surface-200 dark:divide-surface-700">

        {% for m in members %}
        <div class="flex flex-col sm:flex-row sm:items-center justify-between py-4">

            <!-- اطلاعات کاربر -->
            <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-6 w-full sm:w-auto">
                <div class="font-semibold text-base text-range-700 dark:text-range-400">{{ m.user.display_name }}</div>
                <div class="text-sm text-surface-500 dark:text-surface-400">{{ m.user.email }}</div>
            </div>

            <!-- انتخاب نقش و دکمه حذف -->
            <div class="flex items-center gap-4 mt-3 sm:mt-0">
                <select
                    onchange="updateRole({{ m.id }}, this.value)"
                    class="border border-surface-300 dark:border-surface-600 rounded-lg px-3 py-1.5 text-sm text-surface-700 dark:text-surface-300
                           focus:outline-none focus:ring-2 focus:ring-brand-500 transition"
                >
                    {% for role, label in m.Role.choices %}
                    <option value="{{ role }}" {% if role == m.role %}selected{% endif %}>
                        {{ label }}
                    </option>
                    {% endfor %}
                </select>

                <button
                    onclick="deleteMember({{ m.id }})"
                    class="text-red-600 hover:text-red-700 font-medium text-sm transition"
                    aria-label="حذف {{ m.user.display_name }}"
                >
                    حذف
                </button>
            </div>

        </div>
        {% empty %}
        <div class="py-8 text-center text-surface-400 dark:text-surface-500 text-sm select-none">
            هیچ عضوی یافت نشد.
        </div>
        {% endfor %}

    </div>

</div>
