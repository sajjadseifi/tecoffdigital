<div class="bg-surface-50 dark:bg-surface-800 rounded-xl shadow-md border border-surface-200 dark:border-surface-700 p-6 max-w-3xl mx-auto">

    <div class="divide-y divide-surface-200 dark:divide-surface-700">

        {% for invite in invites %}
        <div class="flex flex-col sm:flex-row items-center justify-between py-4">

            <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-6 w-full sm:w-auto">
                <div class="font-semibold text-base text-range-700 dark:text-range-400">{{ invite.email }}</div>
                <div class="text-sm text-surface-500 dark:text-surface-400">{{ invite.get_role_display }}</div>
            </div>

            <div class="flex gap-4 mt-3 sm:mt-0">
                <button
                    onclick="resendInvite('{{ invite.token }}')"
                    class="text-brand-600 hover:text-brand-700 font-medium text-sm transition">
                    ارسال مجدد
                </button>

                <button
                    onclick="cancelInvite('{{ invite.token }}')"
                    class="text-red-600 hover:text-red-700 font-medium text-sm transition">
                    لغو
                </button>
            </div>

        </div>
        {% empty %}
        <div class="py-8 text-center text-surface-400 dark:text-surface-500 text-sm select-none">
            هیچ دعوت‌نامه فعالی وجود ندارد.
        </div>
        {% endfor %}

    </div>
</div>
