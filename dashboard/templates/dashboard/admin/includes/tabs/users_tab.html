<!-- Users Table Component (API Driven) -->
<div x-data="usersTableComponent()" x-init="fetchUsers(1)" class="w-full">
    
    <!-- Header -->
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-surface-900 dark:text-surface-100">کاربران ثبت‌نامی</h2>
        <div class="flex items-center gap-3">
            <!-- Loading Indicator -->
            <span x-show="loading" style="display: none;" class="text-sm text-brand-500 animate-pulse">
                <i class="fas fa-circle-notch fa-spin"></i> در حال دریافت...
            </span>
            <a href="{% url 'admin:catalog_catalog_changelist' %}" target="_blank" class="text-sm text-accent-500 hover:text-accent-600 transition">مشاهده همه در پنل ادمین &larr;</a>

        </div>
    </div>

    <!-- Table Container -->
    <div class="overflow-x-auto border border-surface-200 dark:border-surface-700 rounded-xl bg-white dark:bg-surface-800 shadow-sm">
        <table class="w-full text-right min-w-[800px]">
            <thead class="bg-surface-50 dark:bg-surface-900 text-surface-600 dark:text-surface-300 text-sm border-b border-surface-200 dark:border-surface-700">
                <tr>
                    <th class="p-4 font-medium">کاربر</th>
                    <th class="p-4 font-medium">موبایل / ایمیل</th>
                    <th class="p-4 font-medium">وضعیت تأیید</th>
                    <th class="p-4 font-medium">نقش</th>
                    <th class="p-4 font-medium">تاریخ عضویت</th>
                </tr>
            </thead>
            
            <tbody class="divide-y divide-surface-100 dark:divide-surface-700 text-sm relative">
                
                <!-- Skeleton Loader (shows while fetching) -->
                <template x-if="loading && users.length === 0">
                    <tr>
                        <td colspan="5" class="p-8 text-center text-surface-400">
                            در حال بارگذاری اطلاعات...
                        </td>
                    </tr>
                </template>

                <!-- Empty State -->
                <template x-if="!loading && users.length === 0">
                    <tr>
                        <td colspan="5" class="p-8 text-center text-surface-400 dark:text-surface-500">
                            کاربری یافت نشد.
                        </td>
                    </tr>
                </template>

                <!-- Data Rows -->
                <template x-for="u in users" :key="u.id">
                    <tr class="hover:bg-surface-50 dark:hover:bg-surface-700/50 transition-colors">
                        <td class="p-4 flex items-center gap-3">
                            <!-- Avatar Logic -->
                            <template x-if="u.avatar">
                                <img :src="u.avatar" :alt="u.display_name" class="w-8 h-8 rounded-full object-cover border border-surface-200 dark:border-surface-600">
                            </template>
                            <template x-if="!u.avatar">
                                <div class="w-8 h-8 rounded-full bg-accent-100 dark:bg-accent-900/30 text-accent-600 dark:text-accent-400 flex items-center justify-center font-bold text-xs" x-text="u.display_name.charAt(0)"></div>
                            </template>
                            
                            <span class="font-medium text-surface-900 dark:text-surface-100" x-text="u.display_name"></span>
                        </td>
                        
                        <td class="p-4 text-surface-600 dark:text-surface-300" dir="ltr">
                            <div class="text-right" x-text="u.phone"></div>
                            <template x-if="u.email">
                                <div class="text-xs text-surface-400 mt-0.5" x-text="u.email"></div>
                            </template>
                        </td>
                        
                        <td class="p-4">
                            <template x-if="u.is_phone_verified">
                                <span class="text-green-600 dark:text-green-400 flex items-center gap-1 text-xs">
                                    <i class="fas fa-check-circle"></i> موبایل
                                </span>
                            </template>
                        </td>
                        
                        <td class="p-4">
                            <!-- Role Logic -->
                            <template x-if="u.is_superuser">
                                <span class="bg-purple-100 dark:bg-purple-500/20 text-purple-700 dark:text-purple-300 px-2.5 py-1 rounded-full text-xs">مدیر ارشد</span>
                            </template>
                            <template x-if="!u.is_superuser && u.is_staff">
                                <span class="bg-blue-100 dark:bg-blue-500/20 text-blue-700 dark:text-blue-300 px-2.5 py-1 rounded-full text-xs">ادمین</span>
                            </template>
                            <template x-if="!u.is_superuser && !u.is_staff">
                                <span class="bg-surface-200 dark:bg-surface-700 text-surface-700 dark:text-surface-300 px-2.5 py-1 rounded-full text-xs">کاربر عادی</span>
                            </template>
                        </td>
                        
                        <td class="p-4 text-surface-600 dark:text-surface-400" x-text="u.date_joined_formatted"></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <!-- Pagination Controls -->
    <div class="flex justify-between items-center mt-4 px-2" x-show="totalPages > 1" style="display: none;">
        <span class="text-sm text-surface-500 dark:text-surface-400">
            نمایش <span x-text="users.length"></span> کاربر از <span x-text="totalItems"></span>
        </span>
        
        <div class="flex items-center gap-2">
            <!-- Prev Button -->
            <button @click="changePage(currentPage - 1)" :disabled="currentPage === 1" class="px-3 py-1.5 rounded-lg border border-surface-200 dark:border-surface-700 bg-white dark:bg-surface-800 text-surface-600 dark:text-surface-300 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-surface-50 dark:hover:bg-surface-700 transition">
                قبلی
            </button>
            
            <!-- Page Indicator -->
            <span class="text-sm font-medium text-surface-700 dark:text-surface-200">
                صفحه <span x-text="currentPage"></span> از <span x-text="totalPages"></span>
            </span>
            
            <!-- Next Button -->
            <button @click="changePage(currentPage + 1)" :disabled="currentPage === totalPages" class="px-3 py-1.5 rounded-lg border border-surface-200 dark:border-surface-700 bg-white dark:bg-surface-800 text-surface-600 dark:text-surface-300 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-surface-50 dark:hover:bg-surface-700 transition">
                بعدی
            </button>
        </div>
    </div>
</div>

<!-- Alpine.js Logic -->
<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('usersTableComponent', () => ({
        users: [],
        loading: false,
        currentPage: 1,
        totalPages: 1,
        totalItems: 0,
        
        // آدرس API خود را اینجا قرار دهید (مثلاً با Django REST Framework)
        apiUrl: '/api/users/', 

        async fetchUsers(page = 1) {
            this.loading = true;
            this.currentPage = page;
            
            try {
                // ارسال درخواست به همراه شماره صفحه
                const response = await fetch(`${this.apiUrl}?page=${page}`);
                
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                // فرض بر این است که API شما ساختار استاندارد DRF (Pagination) دارد:
                // { "count": 100, "results": [ { ... }, { ... } ] }
                
                this.users = data.results || data; // پشتیبانی از حالت بدون صفحه‌بندی
                this.totalItems = data.count || this.users.length;
                
                // محاسبه تعداد صفحات (فرض: هر صفحه 10 آیتم)
                const itemsPerPage = 10; 
                this.totalPages = Math.ceil(this.totalItems / itemsPerPage) || 1;
                
            } catch (error) {
                console.error("Error fetching users:", error);
                // در صورت خطا، آرایه را خالی می‌کنیم تا جدول خالی نشان داده شود
                this.users = []; 
            } finally {
                this.loading = false;
            }
        },

        changePage(page) {
            if (page >= 1 && page <= this.totalPages) {
                this.fetchUsers(page);
            }
        }
    }))
})
</script>
