<!-- components/image_file_uploader.html -->
<div id="image-uploader-component" class="border border-surface-200 rounded-2xl overflow-hidden bg-white shadow-sm">
    <!-- تب‌ها -->
    <div class="flex border-b border-surface-100 bg-surface-50">
        <button type="button" onclick="switchImageTab('upload')" id="tab-btn-upload" class="flex-1 py-3 text-sm font-bold text-accent-600 border-b-2 border-accent-500 transition-colors">آپلود از دستگاه</button>
        <button type="button" onclick="switchImageTab('url')" id="tab-btn-url" class="flex-1 py-3 text-sm font-bold text-brand-500 border-b-2 border-transparent hover:text-brand-700 transition-colors">دریافت از لینک (URL)</button>
    </div>

    <div class="p-5">
        <!-- Input مخفی برای ارسال دیتای نهایی به سرور -->
        <input type="hidden" name="cropped_image_base64" id="final-image-data">

        <!-- بخش آپلود فایل -->
        <div id="tab-upload" class="block">
            <div class="relative flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-surface-300 rounded-xl bg-surface-50 hover:bg-surface-100 hover:border-accent-400 transition-all group">
                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                    <svg class="w-10 h-10 mb-3 text-brand-400 group-hover:text-accent-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <p class="mb-2 text-sm text-brand-600 font-bold">برای آپلود کلیک کنید یا عکس را بکشید</p>
                    <p class="text-xs text-brand-400">SVG, PNG, JPG (حداکثر 5MB)</p>
                </div>
                <input id="file-upload-input" type="file" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="handleImageSelection(this.files[0])" />
            </div>
        </div>

        <!-- بخش دریافت از لینک -->
        <div id="tab-url" class="hidden space-y-3">
            <p class="text-xs text-amber-600 bg-amber-50 p-3 rounded-lg border border-amber-100">توجه: دریافت عکس از لینک‌های خارجی ممکن است به دلیل محدودیت‌های امنیتی (CORS) مرورگر مسدود شود.</p>
            <div class="flex gap-2">
                <input type="url" id="image-url-input" class="flex-1 px-4 py-3 rounded-xl border border-surface-200 bg-surface-50 focus:bg-white focus:border-accent-500 focus:ring-2 focus:ring-accent-500/20 outline-none text-brand-900 text-left" dir="ltr" placeholder="https://example.com/image.jpg">
                <button type="button" onclick="fetchImageFromUrl()" class="px-5 py-3 bg-brand-800 hover:bg-brand-900 text-white font-bold rounded-xl transition-colors whitespace-nowrap">دریافت</button>
            </div>
        </div>

        <!-- محیط کراپ (برش) تصویر -->
        <div id="crop-workspace" class="hidden mt-4">
            <div class="w-full h-64 bg-slate-900 rounded-xl overflow-hidden mb-4 relative">
                <img id="image-to-crop" src="" class="max-w-full block" alt="Picture">
            </div>
            
            <div class="flex justify-end gap-2">
                <button type="button" onclick="cancelCrop()" class="px-4 py-2 bg-surface-200 text-brand-700 hover:bg-surface-300 rounded-lg font-bold text-sm transition-colors">لغو و حذف</button>
                <button type="button" onclick="confirmCrop()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg font-bold text-sm transition-colors shadow-lg shadow-emerald-500/30">تایید و اعمال برش</button>
            </div>
        </div>

        <!-- پیش‌نمایش نهایی پس از برش -->
        <div id="final-preview-container" class="hidden mt-4">
            <h4 class="text-sm font-bold text-brand-700 mb-2">پیش‌نمایش نهایی:</h4>
            <div class="relative inline-block border-4 border-white shadow-md rounded-xl overflow-hidden">
                <img id="final-cropped-image" src="" class="w-32 h-32 object-cover" alt="Final Preview">
                <button type="button" onclick="resetUploader()" class="absolute top-1 right-1 bg-white/90 text-rose-500 p-1.5 rounded-lg hover:bg-rose-500 hover:text-white transition-colors backdrop-blur-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            </div>
            <p class="text-xs text-brand-500 mt-2">تصویر آماده ارسال به سرور است.</p>
        </div>
    </div>
</div>

<script>
    (function() {
        let cropper = null;
        const imageToCrop = document.getElementById('image-to-crop');
        const finalDataInput = document.getElementById('final-image-data');

        // مدیریت تب‌ها
        window.switchImageTab = function(tabName) {
            document.getElementById('tab-upload').classList.toggle('hidden', tabName !== 'upload');
            document.getElementById('tab-url').classList.toggle('hidden', tabName !== 'url');
            
            document.getElementById('tab-btn-upload').className = tabName === 'upload' 
                ? 'flex-1 py-3 text-sm font-bold text-accent-600 border-b-2 border-accent-500 transition-colors' 
                : 'flex-1 py-3 text-sm font-bold text-brand-500 border-b-2 border-transparent hover:text-brand-700 transition-colors';
                
            document.getElementById('tab-btn-url').className = tabName === 'url' 
                ? 'flex-1 py-3 text-sm font-bold text-accent-600 border-b-2 border-accent-500 transition-colors' 
                : 'flex-1 py-3 text-sm font-bold text-brand-500 border-b-2 border-transparent hover:text-brand-700 transition-colors';
        };

        // خواندن فایل از دستگاه
        window.handleImageSelection = function(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                initCropper(e.target.result);
            };
            reader.readAsDataURL(file);
        };

        // دریافت تصویر از URL
        window.fetchImageFromUrl = async function() {
            const url = document.getElementById('image-url-input').value;
            if (!url) return alert('لطفا یک لینک وارد کنید');
            
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const reader = new FileReader();
                reader.onload = (e) => initCropper(e.target.result);
                reader.readAsDataURL(blob);
            } catch (error) {
                alert('دریافت تصویر با خطا مواجه شد. ممکن است لینک معتبر نباشد یا سرور مبدا اجازه دسترسی (CORS) ندهد.');
                console.error(error);
            }
        };

        // راه اندازی Cropper.js (چون فقط داخل همین بلاک استفاده می‌شود نیازی به window ندارد)
        function initCropper(imageSrc) {
            document.getElementById('tab-upload').classList.add('hidden');
            document.getElementById('tab-url').classList.add('hidden');
            document.querySelector('.flex.border-b').classList.add('hidden');
            document.getElementById('crop-workspace').classList.remove('hidden');
            document.getElementById('final-preview-container').classList.add('hidden');

            imageToCrop.src = imageSrc;
            
            if (cropper) cropper.destroy();
            
            cropper = new Cropper(imageToCrop, {
                aspectRatio: 1 / 1,
                viewMode: 1,
                dragMode: 'move',
                autoCropArea: 0.9,
                restore: false,
                guides: true,
                center: true,
                highlight: false,
                cropBoxMovable: true,
                cropBoxResizable: true,
                toggleDragModeOnDblclick: false,
            });
        }

        // تایید کراپ و ایجاد خروجی فشرده
        window.confirmCrop = function() {
            if (!cropper) return;
            
            const canvas = cropper.getCroppedCanvas({
                width: 800,
                height: 800,
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high',
            });

            const base64Image = canvas.toDataURL('image/jpeg', 0.8);
            
            finalDataInput.value = base64Image;
            
            document.getElementById('final-cropped-image').src = base64Image;
            document.getElementById('crop-workspace').classList.add('hidden');
            document.getElementById('final-preview-container').classList.remove('hidden');
        };

        // لغو کراپ
        window.cancelCrop = function() {
            window.resetUploader();
        };

        // ریست کردن کل کامپوننت
        window.resetUploader = function() {
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
            imageToCrop.src = '';
            finalDataInput.value = '';
            document.getElementById('file-upload-input').value = '';
            document.getElementById('image-url-input').value = '';
            
            document.getElementById('crop-workspace').classList.add('hidden');
            document.getElementById('final-preview-container').classList.add('hidden');
            document.querySelector('.flex.border-b').classList.remove('hidden');
            
            window.switchImageTab('upload');
        };

    })();
</script>
