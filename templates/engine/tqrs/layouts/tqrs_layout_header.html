{% load static %}
<!-- Header / Nav -->
<header class="w-full p-4 md:p-6 flex justify-between items-center z-20 max-w-7xl mx-auto">
    <div class="flex gap-2 md:gap-4">

        {% if request.user.is_staff %}
            <!-- ورود به پنل (برای ادمین) -->
            <a href="{% url 'auth_login' %}" class="relative inline-flex items-center justify-center px-6 py-2.5 text-sm font-medium text-white transition-all duration-300 ease-in-out rounded-xl group bg-white/5 border border-white/10 hover:bg-white/10 hover:border-cyan-400/50 hover:shadow-[0_0_20px_rgba(34,211,238,0.2)] overflow-hidden backdrop-blur-md">
                <span class="relative z-10 flex items-center gap-2">
                    <svg class="w-4 h-4 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                    </svg>
                    ورود به پنل
                </span>
            </a>
        {% else %}
            <!-- صفحه اصلی -->
            <a href="{% url 'tqrs_index' %}" class="relative inline-flex items-center justify-center px-6 py-2.5 text-sm font-medium text-white transition-all duration-300 ease-in-out rounded-xl group bg-white/5 border border-white/10 hover:bg-white/10 hover:border-cyan-400/50 hover:shadow-[0_0_20px_rgba(34,211,238,0.2)] overflow-hidden backdrop-blur-md">
                <span class="relative z-10 flex items-center gap-2">
                    <svg class="w-6 h-6 transition-transform group-hover:-translate-y-0.5" viewBox="0 0 24 24" fill="currentColor">
                        <path opacity="0.4" d="M12 2.25l8.25 7.5c.37.33.75.89.75 1.5v8c0 1.24-1.01 2.25-2.25 2.25h-3.5a.75.75 0 01-.75-.75v-4.5a1.5 1.5 0 00-1.5-1.5h-2a1.5 1.5 0 00-1.5 1.5v4.5a.75.75 0 01-.75.75H5.25C4.01 21.5 3 20.49 3 19.25v-8c0-.61.38-1.17.75-1.5L12 2.25z" />
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 1.5c.61 0 1.21.24 1.67.68l8.25 7.5a2.25 2.25 0 01-3.03 3.33L12 6.64l-6.89 6.37a2.25 2.25 0 01-3.03-3.33l8.25-7.5A2.25 2.25 0 0112 1.5z" />
                    </svg>
                    صفحه اصلی
                </span>
            </a>

            <!-- داشبورد -->
            <a href="{% url 'tqrs_root' %}" class="relative inline-flex items-center justify-center px-6 py-2.5 text-sm font-medium text-white transition-all duration-300 ease-in-out rounded-xl group bg-white/5 border border-white/10 hover:bg-white/10 hover:border-cyan-400/50 hover:shadow-[0_0_20px_rgba(34,211,238,0.2)] overflow-hidden backdrop-blur-md">
                <span class="relative z-10 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h7v7H3V3zm11 0h7v4h-7V3zM3 14h7v7H3v-7zm11-3h7v10h-7V11z"/>
                    </svg>
                    داشبورد
                </span>
            </a>



            <!-- درباره ما -->
            <a href="{% url 'tqrs_about' %}" class="relative inline-flex items-center justify-center px-6 py-2.5 text-sm font-medium text-white transition-all duration-300 ease-in-out rounded-xl group bg-white/5 border border-white/10 hover:bg-white/10 hover:border-cyan-400/50 hover:shadow-[0_0_20px_rgba(34,211,238,0.2)] overflow-hidden backdrop-blur-md">
                <span class="relative z-10 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1 4h.01M12 8h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    درباره ما
                </span>
            </a>

            <!-- تماس با ما -->
            <a href="{% url 'tqrs_contact' %}" class="relative inline-flex items-center justify-center px-6 py-2.5 text-sm font-medium text-white transition-all duration-300 ease-in-out rounded-xl group bg-white/5 border border-white/10 hover:bg-white/10 hover:border-cyan-400/50 hover:shadow-[0_0_20px_rgba(34,211,238,0.2)] overflow-hidden backdrop-blur-md">
                <span class="relative z-10 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8m-18 8h18"/>
                    </svg>
                    تماس با ما
                </span>
            </a>
                {% if request.user.is_authenticated %}
                    <form method="POST" action="{% url 'auth_logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit"
                            class="relative inline-flex items-center justify-center px-6 py-2.5 text-sm font-medium text-white transition-all duration-300 ease-in-out rounded-xl group bg-white/5 border border-white/10 hover:bg-red-500/10 hover:border-red-400/60 hover:shadow-[0_0_20px_rgba(248,113,113,0.3)] overflow-hidden backdrop-blur-md">
                            
                            <span class="relative z-10 flex items-center gap-2">
                                <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"/>
                                </svg>
                                خروج
                            </span>

                        </button>
                    </form>
                {% endif %}


        {% endif %}
    </div>

    <!-- لوگو و عنوان -->
    <a dir="ltr" href="{% url 'tqrs_index' %}" class="flex items-center gap-4 group cursor-pointer">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center p-[2px] transition-all duration-300">
            <img src="{% static 'icons/tqrs_faveicon.png' %}" class="w-full h-full object-cover" alt="تک کیو آر | TQRS"/>
        </div>
        <div class="flex-col justify-center pt-2">
            <span class="text-md md:text-lg font-bold mb-4 text-glow tracking-tight text-white">
                T<span class="text-cyan-400">QR</span>S
            </span>
            <span class="hidden md:flex text-xs font-medium text-[#22d3ee] mt-1">SOUL ROUTING SYSTEM</span>
        </div>
    </a>
</header>
