<!-- قالب‌های آماده -->
<div class="max-w-5xl mx-auto bg-white/5 backdrop-blur-md border border-white/10 rounded-3xl p-6 md:p-8 shadow-xl">

    <!-- هدر -->
    <div class="text-center mb-10">
        <h2 class="text-3xl font-bold text-white tracking-tight">
            قالب‌های آماده
        </h2>

        <p class="text-gray-400 text-sm mt-2">
            انتخاب کنید و طراحی را در لحظه شروع کنید
        </p>
    </div>

    <!-- راهنما -->
    <div class="mb-8 bg-gradient-to-r from-blue-500/10 to-purple-500/10 border border-blue-500/20 rounded-2xl p-4 flex gap-3">

        <div class="w-10 h-10 rounded-xl bg-blue-500/10 border border-blue-400/20 flex items-center justify-center shrink-0">
            <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>

        <div>
            <h4 class="text-white font-medium text-sm">
                سیستم انتخاب قالب
            </h4>

            <p class="text-xs text-gray-400 mt-1 leading-relaxed">
                قالب انتخابی به صورت خودکار وارد بخش طراحی می‌شود و روی QR اعمال می‌گردد.
            </p>
        </div>

    </div>

    <!-- اسکرول -->
    <div class="overflow-x-auto hide-scrollbar">
        <div class="flex gap-5 min-w-max pb-3">

            <template x-for="tpl in templates" :key="tpl.id">

                <div class="w-56 flex-shrink-0 group relative">

                    <!-- کارت -->
                    <div
                        class="relative rounded-2xl p-4 border border-white/10 bg-black/20 backdrop-blur-md
                               transition-all duration-300 hover:-translate-y-1
                               hover:border-cyan-400/40 hover:shadow-[0_10px_30px_rgba(34,211,238,0.12)]"
                    >

                        <!-- badge -->
                        <div class="absolute top-3 right-3 w-2 h-2 rounded-full"
                             :style="`background:${tpl.colorDark}`"></div>

                        <!-- preview -->
                        <div class="aspect-square rounded-xl bg-white flex items-center justify-center mb-4 relative overflow-hidden">

                            <div class="w-full h-full flex flex-col items-center justify-center border-2 border-dashed rounded-lg"
                                 :style="`border-color:${tpl.colorDark}`">

                                <div class="text-center">

                                    <div class="text-xs font-bold tracking-wider"
                                         :style="`color:${tpl.colorDark}`">
                                        QR STYLE
                                    </div>

                                    <div class="text-[10px] text-gray-500 mt-1">
                                        preview
                                    </div>

                                </div>

                            </div>

                        </div>

                        <!-- title -->
                        <h3 class="text-white text-sm font-semibold tracking-tight text-center">
                            <span x-text="tpl.name"></span>
                        </h3>

                        <!-- subtitle -->
                        <p class="text-[11px] text-gray-400 text-center mt-1">
                            قالب طراحی حرفه‌ای
                        </p>

                        <!-- button -->
                        <button
                            @click="
                                selectedTemplate = tpl.id;
                                mainTab = 'design';
                            "
                            class="mt-4 w-full py-2.5 rounded-xl text-xs font-medium
                                   bg-white/10 text-white border border-white/10
                                   hover:bg-cyan-500/15 hover:border-cyan-400/40
                                   transition-all"
                        >
                            انتخاب و ادامه
                        </button>

                    </div>

                </div>

            </template>

        </div>
    </div>

</div>

<style>
.hide-scrollbar::-webkit-scrollbar { display: none; }
.hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
