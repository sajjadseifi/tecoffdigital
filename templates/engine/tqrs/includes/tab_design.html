<div class="w-full flex flex-col items-center pb-10" x-data="{ 
    qrInput: '', 
    qrGenerated: false,
    generateQR() {
        if(!this.qrInput) return;
        this.qrGenerated = true;
        // پاک کردن کیوآر قبلی
        document.getElementById('qrcode-canvas').innerHTML = '';
        
        // تولید کیوآر جدید (نیازمند کتابخانه qrcode.js در فایل پایه)
        try {
            new QRCode(document.getElementById('qrcode-canvas'), {
                text: this.qrInput,
                width: 200,
                height: 200,
                colorDark : '#000000',
                colorLight : '#ffffff',
                correctLevel : QRCode.CorrectLevel.H
            });
        } catch(e) {
            console.log('QRCode library not loaded yet. Displaying placeholder.');
            // در صورتی که کتابخانه لود نشده باشد یک طرح نمایشی نشان میدهد
            document.getElementById('qrcode-canvas').innerHTML = '<div class=\'w-[200px] h-[200px] bg-white rounded-lg flex items-center justify-center border-4 border-gray-200\'><svg class=\'w-20 h-20 text-gray-400\' fill=\'none\' stroke=\'currentColor\' viewBox=\'0 0 24 24\'><path stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'2\' d=\'M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z\'></path></svg></div>';
        }
    },
    downloadQR() {
        const canvas = document.querySelector('#qrcode-canvas canvas');
        if(canvas) {
            const url = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tecof-qr-code.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    }
}">

    <!-- هدر -->
    <div class="text-center mb-10 w-full max-w-4xl relative z-10">
        <div class="inline-flex items-center gap-2 mb-4 px-4 py-1.5 rounded-full border border-green-500/30 bg-green-500/10 text-green-400 text-xs font-medium tracking-[0.2em] shadow-[0_0_15px_rgba(34,197,94,0.2)]">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            STATIC GENERATOR
        </div>
        <h2 class="text-3xl md:text-5xl font-bold mb-4 text-white">طراحی <span class="text-green-400">فوری</span></h2>
        <p class="text-gray-400 text-sm md:text-base max-w-2xl mx-auto">
            ساخت کیوآر کدهای استاتیک بدون نیاز به ثبت‌نام. (توجه: این کیوآر کدها قابلیت تغییر مسیر یا آمارگیری ندارند).
        </p>
    </div>

    <!-- Generator Interface -->
    <div class="w-full max-w-4xl flex flex-col md:flex-row gap-8 bg-black/40 backdrop-blur-md border border-white/10 rounded-3xl p-6 md:p-8 shadow-2xl relative z-10">
        
        <!-- Input Section -->
        <div class="flex-1 flex flex-col justify-center space-y-6">
            <div>
                <label class="text-sm text-gray-400 font-bold mb-3 block">محتوای کد (متن، لینک، شماره، ...)</label>
                <textarea x-model="qrInput" @input="qrGenerated = false" rows="4" placeholder="محتوای خود را اینجا وارد کنید..." class="w-full bg-black/50 border border-gray-700 rounded-2xl p-4 text-white focus:border-green-500 focus:ring-1 focus:ring-green-500/50 transition-all outline-none resize-none"></textarea>
            </div>
            
            <button @click="generateQR()" :disabled="!qrInput" :class="qrInput ? 'bg-gradient-to-r from-green-500 to-emerald-600 hover:shadow-[0_0_20px_rgba(34,197,94,0.4)] text-white' : 'bg-gray-800 text-gray-500 cursor-not-allowed'" class="w-full py-4 rounded-xl font-bold transition-all flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                تولید رمزنگاری
            </button>
        </div>

        <!-- Output Display Area -->
        <div class="w-full md:w-72 bg-white/5 border border-white/10 rounded-2xl flex flex-col items-center justify-center p-6 min-h-[300px] relative overflow-hidden group">
            
            <!-- حالت خالی پیش‌فرض -->
            <div x-show="!qrGenerated" class="text-center transition-all duration-300">
                <div class="w-20 h-20 mx-auto border-2 border-dashed border-gray-600 rounded-xl flex items-center justify-center mb-4 opacity-50">
                    <svg class="w-8 h-8 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <p class="text-gray-500 text-sm">آماده برای پردازش داده‌ها...</p>
            </div>

            <!-- حالت نمایش کیوآر کد -->
            <div x-show="qrGenerated" x-cloak class="flex flex-col items-center w-full transition-all duration-500">
                <!-- نگهدارنده تصویر کیوآر -->
                <div class="bg-white p-3 rounded-xl mb-6 shadow-[0_0_30px_rgba(34,197,94,0.3)]">
                    <div id="qrcode-canvas"></div>
                </div>
                
                <button @click="downloadQR()" class="w-full bg-white/10 hover:bg-white/20 border border-white/20 text-white py-3 rounded-xl font-bold transition-all flex justify-center items-center gap-2 text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    دانلود تصویر
                </button>
            </div>
        </div>
    </div>
</div>
