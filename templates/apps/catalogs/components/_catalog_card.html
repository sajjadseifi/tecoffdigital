<a href="{{ catalog.get_menu_absolute_url }}" 
   class="group flex flex-col items-center gap-2.5 min-w-[76px] sm:min-w-[84px] shrink-0 snap-start outline-none [-webkit-tap-highlight-color:transparent]">
    
    <!-- ظرف تصویر: بدون پس‌زمینه و سایه، فقط افکت کلیک -->
    <div class="relative w-[72px] h-[72px] sm:w-[80px] sm:h-[80px] overflow-hidden transition-all duration-300 transform-gpu group-active:scale-[0.92] cursor-pointer">
        
        {% if catalog.logo and catalog.logo_or_default %}
            <!-- تصویر اصلی -->
            <img src="{{ catalog.logo_or_default }}" 
                 alt="{{ catalog.title }}" 
                 loading="lazy" 
                 class="absolute inset-0 w-full h-full object-cover rounded-[1.2rem]" />

        {% else %}
            <!-- حالت پیش‌فرض (زمانی که کلا عکسی در دیتابیس نیست) -->
            <div class="absolute inset-0 bg-transparent flex items-center justify-center rounded-[1.2rem] border border-gray-200">
                <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.5 21v-7.5a.75.75 0 01.75-.75h3a.75.75 0 01.75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349m-16.5 11.65V9.35m0 0a3.001 3.001 0 003.75-.615A2.999 2.999 0 009.75 9.75c.896 0 1.7-.393 2.25-1.016a2.999 2.999 0 002.25 1.016c.896 0 1.7-.393 2.25-1.016a3.001 3.001 0 003.75.614m-16.5 0a3.004 3.004 0 01-.621-4.72L4.318 3.44A1.5 1.5 0 015.378 3h13.243a1.5 1.5 0 011.06.44l1.19 1.189a3 3 0 01-.621 4.72m-13.5 8.65h3.75a.75.75 0 00.75-.75V13.5a.75.75 0 00-.75-.75H6.75a.75.75 0 00-.75.75v3.75c0 .415.336.75.75.75z"></path>
                </svg>
            </div>
        {% endif %}
    </div>
    
    <!-- متن عنوان: سایز فونت بزرگ‌تر شد (14px در موبایل، 15px در دسکتاپ) -->
    <span class="text-[14px] sm:text-[15px] font-medium text-gray-800 tracking-tight text-center leading-snug line-clamp-2 w-full px-0.5 group-hover:text-blue-600 transition-colors">
        {{ catalog.title }}
    </span>
</a>
