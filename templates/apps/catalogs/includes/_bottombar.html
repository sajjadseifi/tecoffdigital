<!-- ========= MAMMOTH SEARCH BAR (ChatGPT Style) ========= -->
<div style="z-index:99999" class="fixed bottom-6 inset-x-0 flex justify-center px-4 md:px-0" dir="rtl">
    
    <div class="relative w-full max-w-3xl group">
        
        <!-- Glow Effect (Subtle) -->
        <div class="absolute -inset-0.5 rounded-3xl bg-gradient-to-r from-indigo-100 via-blue-100 to-sky-100 blur-md opacity-60 group-hover:opacity-100 transition duration-500"></div>

        <!-- Main Container -->
        <div class="relative flex flex-col bg-white border border-gray-200 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.06)] overflow-hidden transition-all duration-300 focus-within:shadow-[0_8px_30px_rgb(0,0,0,0.12)] focus-within:border-gray-300">

            <form class="flex flex-col" enctype="multipart/form-data">
                
                <!-- TEXTAREA -->
                <textarea
                    id="search-input"
                    rows="2"
                    placeholder="جستجو در فضای دیجیتال ماموت..."
                    class="w-full resize-none bg-transparent text-[14px] text-slate-800 placeholder:text-slate-400 focus:outline-none p-4 pb-2 leading-relaxed custom-scrollbar"
                ></textarea>

                <!-- ACTION BAR (Buttons) -->
                <div class="flex items-center justify-between px-3 pb-3 pt-1">
                    
                    <!-- Right Side (Attach) -->
                    <label class="cursor-pointer w-10 h-10 flex items-center justify-center rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-700 transition-all duration-200 active:scale-[0.85]">
                        <input type="file" name="image" accept="image/*" class="hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M18.375 12.739l-7.693 7.693a4.5 4.5 0 01-6.364-6.364l10.94-10.94A3 3 0 1119.5 7.372L8.552 18.32m.009-.01l-.01.01m5.699-9.941l-7.81 7.81a1.5 1.5 0 002.112 2.13" />
                        </svg>
                    </label>

                    <!-- Left Side (Submit) -->
                    <button
                        type="submit"
                        class="h-9 px-4 rounded-full bg-slate-900 text-white text-sm font-medium flex items-center gap-2 hover:bg-indigo-600 transition-all duration-300 active:scale-[0.85] shadow-sm">
                        <span>جستجو</span>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 -rotate-90">
                            <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" />
                        </svg>
                    </button>

                </div>
            </form>

        </div>
    </div>
</div>

<style>
/* مخفی کردن اسکرول‌بار زشت مرورگر برای فیلد متنی */
.custom-scrollbar::-webkit-scrollbar {
    width: 4px;
}
.custom-scrollbar::-webkit-scrollbar-track {
    background: transparent;
}
.custom-scrollbar::-webkit-scrollbar-thumb {
    background-color: #e2e8f0;
    border-radius: 10px;
}
</style>
