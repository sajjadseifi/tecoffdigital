<div class="w-full -w-sm mx-auto pb-6 flex flex-col" x-data="{ showPassword:false }">

    <!-- عنوان -->
    <div class="text-center mb-6 mt-1">
        <h2 class="text-xl font-extrabold text-brand-900">ورود به حساب</h2>
        <p class="text-sm text-slate-500 mt-1">
            برای ادامه شماره موبایل و رمز عبور خود را وارد کنید
        </p>
    </div>

    <!-- باکس خطا -->
    <div id="error-box"
         class="hidden mb-5 flex items-center gap-2 text-sm bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl">

        <svg class="w-5 h-5 shrink-0 text-red-500" fill="none" stroke="currentColor" stroke-width="2"
             viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 9v2m0 4h.01M5.07 19h13.86c1.54 0
                     2.5-1.67 1.73-3L13.73 4c-.77-1.33-2.69-1.33-3.46
                     0L3.34 16c-.77 1.33.19 3 1.73 3z"/>
        </svg>

        <span id="error-text">خطا</span>
    </div>

    <!-- فرم -->
    <form id="login-form" class="space-y-5">

        {% csrf_token %}

        <!-- موبایل -->
        <div>
            <label class="block text-sm font-semibold text-brand-700 mb-2">
                شماره موبایل
            </label>

            <div class="relative">

                <input
                        id="identifier"
                        name="identifier"
                        inputmode="tel"
                        autocomplete="tel"
                        placeholder="09123456789"
                        class="w-full h-12 px-4 rounded-xl border border-slate-200 bg-slate-50
                               focus:bg-white focus:border-accent-500 focus:ring-2 focus:ring-accent-100
                               outline-none text-base dir-ltr text-left transition"
                        required
                />

                <!-- badge -->
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400">
                    +98
                </span>

            </div>

            <p class="text-xs text-slate-400 mt-1">
                شماره باید با 09 شروع شود
            </p>
        </div>

        <!-- رمز -->
        <div>
            <label class="block text-sm font-semibold text-brand-700 mb-2">
                رمز عبور
            </label>

            <div class="relative">

                <input
                        id="password"
                        name="password"
                        :type="showPassword ? 'text' : 'password'"
                        placeholder="رمز عبور"
                        autocomplete="current-password"
                        class="w-full h-12 px-4 rounded-xl border border-slate-200 bg-slate-50
                               focus:bg-white focus:border-accent-500 focus:ring-2 focus:ring-accent-100
                               outline-none dir-ltr text-left tracking-widest font-semibold transition"
                        required
                />
            
                <!-- show password -->
                <button
                        type="button"
                        @click="showPassword = !showPassword"
                        class="flex items-center absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400">

                    <!-- eye off -->
                    <svg x-show="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M3.98 8.223A10.477 10.477 0 001.934 12
                                 C3.226 16.338 7.244 19.5 12 19.5
                                 c.993 0 1.953-.138 2.863-.395"/>
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M6.228 6.228A10.451 10.451 0 0112 4.5
                                 c4.756 0 8.773 3.162 10.065 7.498
                                 a10.522 10.522 0 01-4.293 5.774"/>
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M6.228 6.228 3 3m18 18-3.228-3.228"/>
                    </svg>

                    <!-- eye -->
                    <svg x-show="showPassword" x-cloak class="w-5 h-5"
                         fill="none" stroke="currentColor" stroke-width="1.5"
                         viewBox="0 0 24 24">

                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M2.036 12.322a1.012 1.012 0
                                 010-.639C3.423 7.51 7.36 4.5
                                 12 4.5s8.573 3.007 9.963 7.178
                                 c.07.207.07.431 0 .639
                                 C20.577 16.49 16.64 19.5
                                 12 19.5S3.423 16.49 2.036 12.322z"/>

                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M15 12a3 3 0 11-6 0
                                 3 3 0 016 0z"/>
                    </svg>
                </button>

            </div>
        </div>

        <!-- دکمه -->
        <button
                id="login-btn"
                type="submit"
                class="w-full py-3.5 px-4 bg-gray-700 hover:bg-gray-900 text-white rounded-xl font-medium shadow-soft transition-all duration-300"
        >
            <span id="login-btn-text">ورود به حساب</span>

            <svg id="login-spinner"
                 class="hidden w-5 h-5 animate-spin"
                 viewBox="0 0 24 24">

                <circle class="opacity-25"
                        cx="12"
                        cy="12"
                        r="10"
                        stroke="currentColor"
                        stroke-width="4">
                </circle>

                <path class="opacity-75"
                      fill="currentColor"
                      d="M4 12a8 8 0 018-8V0C5.37
                         0 0 5.37 0 12h4z">
                </path>
            </svg>

        </button>

        <!-- لینک ها -->
        <div class="flex justify-between text-sm pt-1">

            <a href="{% url "auth_login" %}"
               class="text-accent-600 hover:text-accent-700 font-medium">
                فراموشی رمز
            </a>

       
        </div>

    </form>

</div>


<script>
document.addEventListener('DOMContentLoaded', () => {

    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');
    const errorText = document.getElementById('error-text');
    const loginBtn = document.getElementById('login-btn');
    const spinner = document.getElementById('login-spinner');
    const btnText = document.getElementById('login-btn-text');

    function showError(msg) {
        errorText.textContent = msg;
        errorBox.classList.remove('hidden');
    }

    function hideError() {
        errorBox.classList.add('hidden');
    }

    async function handleLogin(e) {

        e.preventDefault();
        hideError();

        const phone = document.getElementById('identifier').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!phone || !password) {
            showError('شماره موبایل و رمز عبور الزامی است.');
            return;
        }

        spinner.classList.remove('hidden');
        btnText.textContent = 'در حال ورود...';
        loginBtn.disabled = true;

        try {

            const response = await fetch("{% url 'auth_sign_in' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    identifier: phone,
                    password: password
                })
            });

            const data = await response.json();

            if (response.ok && data.success) {

                window.location.href = data.redirect_url || '/';

            } else {

                showError(data.message || 'اطلاعات ورود صحیح نیست');

            }

        } catch (err) {

            showError('ارتباط با سرور برقرار نشد');

        } finally {

            spinner.classList.add('hidden');
            btnText.textContent = 'ورود به حساب';
            loginBtn.disabled = false;

        }
    }

    function getCookie(name) {

        const cookies = document.cookie.split(';');

        for (let c of cookies) {

            const [key, value] = c.trim().split('=');

            if (key === name) {
                return decodeURIComponent(value);
            }
        }

        return null;
    }

    form.addEventListener('submit', handleLogin);
});
</script>
