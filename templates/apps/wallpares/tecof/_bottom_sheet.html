<!-- فایل: _bottom_sheet.html -->
<div x-data="bottomSheetLogic('{{ sheet_id }}')"
     x-show="$store.sheet.active === sheetId"
     x-cloak
     class="fixed w-full pb-16 inset-0 z-40 flex items-end justify-center pointer-events-none">

    <!-- پس‌زمینه تیره (Overlay) -->
    <div x-show="$store.sheet.active === sheetId"
         x-transition:enter="transition-opacity ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="closeSheet"
         class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm pointer-events-auto">
    </div>
    
    <!-- 👇 لایه اول (بیرونی): کنترل انیمیشن کشویی باز و بسته شدن 👇 -->
    <div class="relative bottom-0 w-full max-w-sm px-4"
         x-show="$store.sheet.active === sheetId"
         x-transition:enter="transition-transform duration-500 ease-out"
         x-transition:enter-start="translate-y-full"
         x-transition:enter-end="translate-y-0"
         x-transition:leave="transition-transform duration-300 ease-in"
         x-transition:leave-start="translate-y-0"
         x-transition:leave-end="translate-y-full">
         
        <!-- 👇 لایه دوم (داخلی): فقط برای انیمیشن کشیدن با دست (Drag & Spring) 👇 -->
        <div x-ref="sheetElement"
            :style="`transform: translateY(${translateY}px); transition: ${isDragging ? 'none' : 'transform 0.5s cubic-bezier(0.32, 0.72, 0, 1)'};`"
            class="w-full h-auto max-h-[80vh] bg-white rounded-t-[2rem] shadow-[0_-15px_40px_rgba(0,0,0,0.08)] flex flex-col pointer-events-auto will-change-transform relative">
            
            <!-- هدر ثابت (ناحیه درگ و کلیک) -->
            <div class="w-full h-14 shrink-0 cursor-grab active:cursor-grabbing touch-none relative rounded-t-[2rem]"
                @touchstart.passive="startDrag"
                @touchmove.passive="drag"
                @touchend="endDrag"
                @mousedown="startDrag"
                @mousemove="drag"
                @mouseup="endDrag"
                @mouseleave="endDrag">
                
                <!-- ✨ تب لاین نارنجی متصل به بالا (جایگزین خط خاکستری) ✨ -->
                <div class="absolute top-0 left-1/2 -translate-x-1/2 w-14 h-1.5 rounded-b-full bg-gradient-to-r from-orange-400 to-orange-600 transition-all duration-300 shadow-[0_2px_8px_rgba(234,88,12,0.4)] z-10 origin-top"
                    :class="isDragging ? 'scale-x-125 scale-y-125 shadow-[0_4px_12px_rgba(234,88,12,0.6)]' : ''"></div>
                
                <!-- دکمه بستن (X) -->
                <button @click="closeSheet" class="absolute left-5 top-3.5 w-8 h-8 flex items-center justify-center rounded-full bg-slate-50 text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors z-20">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- محتوای اسکرول‌پذیر اختصاصی -->
            <div class="flex-1 overflow-y-auto px-5 pt-0 pb-40 custom-scrollbar relative z-0 overscroll-contain">
                {% include template %}
            </div>
        </div>
    </div>

</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('bottomSheetLogic', (sheetId) => ({
        sheetId: sheetId,
        isDragging: false,
        startY: 0,
        translateY: 0, 
        startTime: 0,

        init() {
            this.$watch('$store.sheet.active', (val) => {
                if (val === this.sheetId) {
                    this.translateY = 0; 
                }
            });
        },

        closeSheet() {
            this.$store.sheet.close();
            setTimeout(() => { 
                this.translateY = 0; 
            }, 300);
        },

        startDrag(e) {
            this.isDragging = true;
            this.startY = e.touches ? e.touches[0].clientY : e.clientY;
            this.startTime = Date.now();
        },

        drag(e) {
            if (!this.isDragging) return;
            
            const currentY = e.touches ? e.touches[0].clientY : e.clientY;
            let deltaY = currentY - this.startY;

            if (deltaY < 0) {
                deltaY = -Math.pow(-deltaY, 0.75) * 2;
            }

            this.translateY = deltaY;
        },

        endDrag() {
            if (!this.isDragging) return;
            this.isDragging = false;

            const timeElapsed = Date.now() - this.startTime;
            const velocity = this.translateY / timeElapsed; 

            if (this.translateY > 120 || (velocity > 0.45 && this.translateY > 20)) {
                this.closeSheet();
            } else {
                this.translateY = 0;
            }
        }
    }));
});
</script>

<style>
    .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 20px;
    }
    .custom-scrollbar:hover::-webkit-scrollbar-thumb {
        background-color: #94a3b8;
    }
</style>
