<template x-if="pullDistance > 0">
    <div 
        class="w-full flex justify-center items-start overflow-hidden"
        :class="{ 'transition-all duration-300 ease-out': !isDragging }"
        :style="{ height: pullDistance + 20 + 'px' }"
    >
        <!-- باکس سفید پس‌زمینه لودینگ -->
        <div 
            class="mt-8 flex items-center justify-center w-10 h-10 rounded-full  relative"
            :style="{ 
                transform: `scale(${Math.min(pullDistance / threshold, 1)})`,
                opacity: Math.min(pullDistance / (threshold * 0.8), 1)
            }"
        >
            <!-- نسخه مینی و تعاملی لودینگ شما -->
            <div class="relative flex items-center justify-center w-6 h-6">
                
                <!-- هاله تپنده بیرونی (فقط زمان رفرش فعال می‌شود) -->
                <div class="absolute inset-[-4px] rounded-full border-2 border-orange-400/40 transition-opacity duration-300"
                     :class="isRefreshing ? 'animate-[ping_1.5s_cubic-bezier(0,0,0.2,1)_infinite] opacity-100' : 'opacity-0'">
                </div>
                
                <!-- حلقه اول (بیرونی) -->
                <div class="absolute inset-0 rounded-full border-2 border-transparent border-t-orange-500 border-r-orange-500 opacity-90 origin-center"
                     :class="isRefreshing ? 'animate-[spin_1s_linear_infinite]' : 'transition-transform duration-75 ease-out'"
                     :style="!isRefreshing && `transform: rotate(${pullDistance * 4}deg)`">
                </div>
                
                <!-- حلقه دوم (داخلی - کوچکتر و خلاف جهت) -->
                <div class="absolute inset-[3px] rounded-full border-2 border-transparent border-b-orange-400 border-l-orange-400 opacity-70 origin-center"
                     :class="isRefreshing ? 'animate-[spin_1.5s_linear_infinite_reverse]' : 'transition-transform duration-75 ease-out'"
                     :style="!isRefreshing && `transform: rotate(-${pullDistance * 5}deg)`">
                </div>
                
                <!-- هسته مرکزی درخشان -->
                <div class="w-1.5 h-1.5 bg-gradient-to-tr from-orange-600 to-orange-400 rounded-full shadow-[0_0_8px_rgba(249,115,22,0.8)] transition-transform duration-75"
                     :class="isRefreshing ? 'animate-pulse scale-125' : ''"
                     :style="!isRefreshing && `transform: scale(${Math.min((pullDistance / threshold) * 1.5, 1.2)})`">
                </div>
                
            </div>
        </div>
    </div>
</template>
