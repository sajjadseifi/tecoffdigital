<div x-data="{ tab: 'catalog' }" class="w-full min-h-[500px]">

    <!-- Tabs -->
    <div class="flex items-center gap-2 p-2 bg-slate-100 rounded-xl mb-4  ">

        <button 
            @click="tab = 'catalog'"
            class="flex-1 py-2 rounded-lg text-sm font-medium transition"
            :class="tab === 'catalog'
                ? 'bg-white text-indigo-600 ring-1 ring-indigo-200'
                : 'text-slate-500'">
            کاتالوگ
        </button>

        <button 
            @click="tab = 'category'"
            class="flex-1 py-2 rounded-lg text-sm font-medium transition"
            :class="tab === 'category'
                ? 'bg-white text-indigo-600 ring-1 ring-indigo-200'
                : 'text-slate-500'">
            دسته‌بندی
        </button>

        <button 
            @click="tab = 'item'"
            class="flex-1 py-2 rounded-lg text-sm font-medium transition"
            :class="tab === 'item'
                ? 'bg-white text-indigo-600 ring-1 ring-indigo-200'
                : 'text-slate-500'">
            آیتم
        </button>

        <button 
            @click="tab = 'website'"
            class="flex-1 py-2 rounded-lg text-sm font-medium transition"
            :class="tab === 'website'
                ? 'bg-white text-indigo-600 ring-1 ring-indigo-200'
                : 'text-slate-500'">
            وبسایت
        </button>

    </div>


    <!-- CONTENT AREA -->
    <div class="relative">

        <!-- کاتالوگ -->
        <div
            x-show="tab === 'catalog'"
            class="absolute inset-0 py-3"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-2"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-2"
        >
            {% include './setting/catalog.html' %}
        </div>

        <!-- دسته‌بندی -->
        <div
            x-show="tab === 'category'"
            class="absolute inset-0 py-3"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-2"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-2"
        >
            {% include './setting/category.html' %}
        </div>

        <!-- آیتم -->
        <div
            x-show="tab === 'item'"
            class="absolute inset-0 py-3"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-2"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-2"
        >
            {% include './setting/item.html' %}
        </div>

        <!-- وبسایت -->
        <div
            x-show="tab === 'website'"
            class="absolute inset-0 py-3"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-2"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-2"
        >
            {% include './setting/website.html' %}
        </div>

    </div>

</div>
