<div
    x-data="{
        tab: 'profile',
        isLoading: false,
        message: '',
        messageType: 'success',

        first_name: '{{ request.user.first_name|default:'' }}',
        last_name: '{{ request.user.last_name|default:'' }}',
        email: '{{ request.user.email|default:'' }}',
        mobile: '{{ request.user.phone }}',

        async updateProfile() {
            this.isLoading = true;
            this.message = '';

            try {
                let res = await fetch('/accounts/profile/update/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({
                        mobile: this.mobile,
                        first_name: this.first_name,
                        last_name: this.last_name,
                        email: this.email
                    })
                });

                let data = await res.json();

                if (data.success) {
                    this.messageType = 'success';
                    this.message = 'اطلاعات با موفقیت ذخیره شد';
                } else {
                    this.messageType = 'error';
                    this.message = data.error || 'خطا در ذخیره اطلاعات';
                }
            } catch (e) {
                this.messageType = 'error';
                this.message = 'خطای ارتباط با سرور';
            }

            this.isLoading = false;
            
            // محو کردن پیام
            if(this.message) {
                setTimeout(() => { this.message = ''; }, 3000);
            }
        },
    }"
    dir="rtl"
    class="max-w-md w-full mx-auto bg-white rounded-2xl  overflow-hidden relative min-h-[500px] flex flex-col font-sans"
>

    <!-- Toast Message -->
    <template x-if="message">
        <div
            class="absolute top-4 left-0 right-0 z-50 flex justify-center pointer-events-none"
            x-show="message"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 -translate-y-4"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 -translate-y-4"
        >
            <div
                class="pointer-events-auto text-sm font-medium px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 border"
                :class="messageType === 'error' ? 'bg-rose-50 text-rose-600 border-rose-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'"
            >
                <span x-text="message"></span>
            </div>
        </div>
    </template>

    <!-- Tabs -->
    <div class="px-5 pt-5 pb-2">
        <div class="flex p-1 bg-slate-100/80 rounded-xl">
            <button
                @click="tab = 'profile'; message = ''"
                class="flex items-center justify-center gap-2 flex-1 py-2 text-sm font-medium rounded-lg transition-all duration-200"
                :class="tab === 'profile' ? 'bg-white text-indigo-700 shadow-sm ring-1 ring-black/5' : 'text-slate-500 hover:text-slate-700'"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                پروفایل من
            </button>

            <button
                @click="tab = 'logout'; message = ''"
                class="flex items-center justify-center gap-2 flex-1 py-2 text-sm font-medium rounded-lg transition-all duration-200"
                :class="tab === 'logout' ? 'bg-white text-rose-600 shadow-sm ring-1 ring-black/5' : 'text-slate-500 hover:text-slate-700'"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7"/>
                </svg>
                خروج
            </button>
        </div>
    </div>

    <!-- Content Area -->
    <div class="flex-1 relative overflow-hidden">
        
        <!-- PROFILE TAB -->
        <div
            x-show="tab === 'profile'"
            x-transition:enter="transition ease-out duration-300 delay-100"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-100"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            class="absolute inset-0 overflow-y-auto px-5 pb-6 pt-2"
            style="display: none;"
        >
            <div class="text-slate-500 text-xs text-center mb-6">
                اطلاعات حساب خود را ویرایش کنید
            </div>

            <form @submit.prevent="updateProfile" class="space-y-4">
                
                <!-- Mobile (Disabled) -->
                <div class="relative flex items-center">
                    <!-- Icon -->
                    <svg class="absolute right-3.5 w-5 h-5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                    </svg>
                    <!-- Input -->
                    <input
                        type="text"
                        x-model="mobile"
                        disabled
                        dir="ltr"
                        class="w-full h-12 bg-slate-100 border border-slate-200 text-slate-500 rounded-xl pr-11 pl-20 text-sm text-right cursor-not-allowed outline-none"
                    />
                    <!-- Badge Label -->
                    <div class="absolute left-2 bg-white border border-slate-200 shadow-sm text-slate-500 text-[11px] font-medium px-2 py-1 rounded-lg pointer-events-none">
                        موبایل
                    </div>
                </div>

                <!-- First Name -->
                <div class="relative flex items-center">
                    <!-- Icon -->
                    <svg class="absolute right-3.5 w-5 h-5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    <!-- Input -->
                    <input
                        type="text"
                        x-model="first_name"
                        class="w-full h-12 bg-slate-50 border border-slate-200 rounded-xl pr-11 pl-20 text-sm transition-all focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 outline-none"
                    />
                    <!-- Badge Label -->
                    <div class="absolute left-2 bg-white border border-slate-200 shadow-sm text-slate-500 text-[11px] font-medium px-2 py-1 rounded-lg pointer-events-none">
                        نام
                    </div>
                </div>

                <!-- Last Name -->
                <div class="relative flex items-center">
                    <!-- Icon -->
                    <svg class="absolute right-3.5 w-5 h-5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                    <!-- Input -->
                    <input
                        type="text"
                        x-model="last_name"
                        class="w-full h-12 bg-slate-50 border border-slate-200 rounded-xl pr-11 pl-24 text-sm transition-all focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 outline-none"
                    />
                    <!-- Badge Label -->
                    <div class="absolute left-2 bg-white border border-slate-200 shadow-sm text-slate-500 text-[11px] font-medium px-2 py-1 rounded-lg pointer-events-none">
                        نام خانوادگی
                    </div>
                </div>

                <!-- Email -->
                <div class="relative flex items-center">
                    <!-- Icon -->
                    <svg class="absolute right-3.5 w-5 h-5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                    <!-- Input -->
                    <input
                        type="email"
                        x-model="email"
                        dir="ltr"
                        placeholder="email@example.com"
                        class="w-full h-12 bg-slate-50 border border-slate-200 rounded-xl pr-11 pl-20 text-sm text-left transition-all focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 outline-none"
                    />
                    <!-- Badge Label -->
                    <div class="absolute left-2 bg-white border border-slate-200 shadow-sm text-slate-500 text-[11px] font-medium px-2 py-1 rounded-lg pointer-events-none">
                        ایمیل
                    </div>
                </div>

                <!-- Save Button -->
                <div class="pt-4">
                    <button
                        type="submit"
                        :disabled="isLoading"
                        class="w-full h-12 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-medium transition-all flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed shadow-md"
                    >
                        <span x-show="!isLoading">ذخیره تغییرات</span>
                        <svg x-show="isLoading" class="animate-spin w-5 h-5" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"/>
                            <path fill="currentColor" class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
                        </svg>
                    </button>
                </div>
            </form>
        </div>

        <!-- LOGOUT TAB -->
        <div
            x-show="tab === 'logout'"
            x-transition:enter="transition ease-out duration-300 delay-100"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-100"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            class="absolute inset-0 px-5 flex flex-col items-center justify-center text-center pb-8"
            style="display: none;"
        >
            <div class="w-20 h-20 rounded-full bg-rose-50 border-8 border-rose-100/50 flex items-center justify-center mb-5">
                <svg class="w-8 h-8 text-rose-500 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7"/>
                </svg>
            </div>

            <h3 class="text-lg font-bold text-slate-800 mb-2">
                خروج از حساب کاربری
            </h3>
            
            <p class="text-slate-500 text-sm mb-8 px-4 leading-relaxed">
                آیا مطمئن هستید که می‌خواهید از حساب خود خارج شوید؟ برای دسترسی مجدد نیاز به ورود خواهید داشت.
            </p>

            <div class="w-full flex flex-col gap-3">
       
                 <form action="{% url 'auth_logout' %}" method="POST" class="flex-1">
                        {% csrf_token %}
                        <button type="submit" class="w-full px-5 py-3.5 rounded-2xl bg-gradient-to-r from-red-500 to-red-600 text-white font-bold hover:from-red-600 hover:to-red-700 transition-all shadow-lg shadow-red-500/20 active:scale-95 border border-red-500">
                        بله، خارج می‌شوم
                        </button>
                </form>
                <button
                    @click="tab = 'profile'"
                    class="w-full h-12 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-xl font-medium transition-colors"
                >
                    انصراف و بازگشت
                </button>
            </div>
        </div>

    </div>
</div>
