<div x-data="{ tab: 'categories' }" class="w-full  min-h-[500px]" >

    <!-- Tabs -->
    <div class="flex items-center gap-2 p-2 bg-slate-100 rounded-xl mb-3 ">

        <button 
            class="flex-1 py-2 rounded-lg text-sm font-medium transition"
            :class="tab === 'categories'
                ? 'bg-white text-indigo-600 ring-1 ring-indigo-200'
                : 'text-slate-500'"
            @click="tab = 'categories'">
            دسته‌بندی
        </button>

        <button 
            class="flex-1 py-2 rounded-lg text-sm font-medium transition"
            :class="tab === 'products'
                ? 'bg-white text-indigo-600 ring-1 ring-indigo-200'
                : 'text-slate-500'"
            @click="tab = 'products'">
            محصولات
        </button>

        <button 
            class="flex-1 py-2 rounded-lg text-sm font-medium transition"
            :class="tab === 'prices'
                ? 'bg-white text-indigo-600 ring-1 ring-indigo-200'
                : 'text-slate-500'"
            @click="tab = 'prices'">
            قیمت‌ها
        </button>

    </div>

    <!-- TAB CONTENT -->
    <div class="relative">

        <!-- دسته‌ها -->
        <div
            x-show="tab === 'categories'"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-2"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-2"
            class="py-3 absolute inset-0"
        >
            {% include './catalog/categories.html' %}
        </div>

        <!-- محصولات -->
        <div
            x-show="tab === 'products'"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-2"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-2"
            class="py-3 absolute inset-0"
        >
            {% include './catalog/items.html' %}
        </div>

        <!-- قیمت‌ها -->
        <div
            x-show="tab === 'prices'"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-2"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-2"
            class="py-3 absolute inset-0"
        >
            {% include './catalog/prices.html' %}
        </div>

    </div>

</div>
