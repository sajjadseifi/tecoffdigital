<template x-if="$store.sheet.data">
    <div dir="rtl" class="pb-20 animate-fadeIn ease-out duration-300 ">
        <div class="w-full h-64 bg-gray-100 rounded-b-3xl overflow-hidden relative shadow-md mb-6">
            <template x-if="$store.sheet.data.image">
                <img :src="$store.sheet.data.image" alt="" class="w-full h-full object-cover">
            </template>
            <template x-if="!$store.sheet.data.image">
                <div class="w-full h-full flex items-center justify-center text-gray-400 bg-gray-100">
                    <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                              d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <span class="text-sm font-medium">تصویری ثبت نشده</span>
                </div>
            </template>


            <div class="absolute top-4 left-4 flex flex-col items-end gap-2">
                <template x-if="$store.sheet.data.is_featured">
                    <span class="bg-yellow-400 text-yellow-900 text-xs font-extrabold px-3 py-1 rounded-full shadow">ویژه</span>
                </template>
                <template x-if="!$store.sheet.data.is_available || $store.sheet.data.stock === 0">
                    <span class="bg-red-500 text-white text-xs font-extrabold px-3 py-1 rounded-full shadow">ناموجود</span>
                </template>
            </div>
        </div>

        <div class="px-5 flex flex-col gap-2">
            <div class="">
                <template x-if="$store.sheet.data.category">
                    <span class="text-xs font-bold text-orange-600 bg-orange-50 px-2 py-1 rounded inline-block mb-1">
                        دسته بندی: <span x-text="$store.sheet.data.category"></span>
                    </span>
                </template>
                <h2 class="text-2xl font-extrabold text-gray-900 leading-tight" x-text="$store.sheet.data.title"></h2>
            </div>
            
            <div class="text-gray-700 text-justify text-sm leading-relaxed p-2 px-4">
                <template x-if="$store.sheet.data.description">
                    <p x-text="$store.sheet.data.description"></p>
                </template>
                <template x-if="!$store.sheet.data.description">
                    <p class="italic text-gray-400">توضیحاتی برای این محصول ثبت نشده است.</p>
                </template>
            </div>
            <div class="flex items-center justify-between">
                <span class="text-sm font-bold text-gray-500 block mb-3">مبلغ قابل پرداخت:</span>
                <div class="flex items-center gap-1.5">
                    <span class="font-black text-sm tracking-tight" x-text="$store.sheet.data.price"></span>
                    <span class="text-[10px] text-slate-500 font-medium">ریال</span>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white border border-gray-200 rounded-xl p-3 shadow-sm flex flex-col justify-center">
                    <span class="text-xs text-gray-400 mb-1 font-medium">کد محصول (SKU)</span>
                    <span class="text-sm font-semibold text-gray-800" x-text="$store.sheet.data.sku || 'ندارد'"></span>
                </div>
                <div class="bg-white border border-gray-200 rounded-xl p-3 shadow-sm flex flex-col justify-center">
                    <span class="text-xs text-gray-400 mb-1 font-medium">وضعیت انبار</span>
                    <template x-if="$store.sheet.data.is_available && $store.sheet.data.stock > 0">
                        <span class="text-sm font-semibold text-green-600" x-text="'موجود (' + $store.sheet.data.stock + ' عدد)'"></span>
                    </template>
                    <template x-if="!$store.sheet.data.is_available || $store.sheet.data.stock === 0">
                        <span class="text-sm font-semibold text-red-500">ناموجود</span>
                    </template>
                </div>
            </div>
        </div>
    </div>
</template>
