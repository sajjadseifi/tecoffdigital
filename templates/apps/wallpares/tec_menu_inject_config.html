{% load static %}
<script>
/**
 * ============================================================
 * TECU MENU CONFIG BOOTSTRAP
 * ------------------------------------------------------------
 * این آبجکت، پیکربندی اولیه سیستم منوی TECU را از Django  
 * به فرانت منتقل می‌کند.
 *
 * TECU یک سیستم "Config-Driven" است:
 * یعنی رفتار UI فقط با داده‌هایی که در اینجا وارد می‌شوند
 * کنترل می‌شود.  
 *
 * این فایل:
 *   - دسته‌ها را از مدل Django سریالایز کرده و به JS می‌دهد
 *   - مسیرهای API را inject می‌کند (جستجو + آیتم‌های دسته)
 *   - هیچ logic داخل قالب نیست → صرفاً انتقال داده
 *
 * مهم‌ترین اصل: فرانت → Reactive / بک‌اند → Data Provider
 * ============================================================
 */
window.MENU_CONFIG = {

    /**
     * --------------------------------------------------------
     * categories
     * --------------------------------------------------------
     * لیست دسته‌های سطح اول کاتالوگ.
     * هر دسته شامل:
     *   - slug  → شناسه یکتا برای URL و انتخاب
     *   - title → عنوان دسته
     *   - image → تصویر شاخص (اختیاری)
     *   - count → تعداد آیتم‌های کل زیرمجموعه
     *
     * نکته مهم TECU:
     * UI شما 100% مطابق داده تغییری می‌کند.
     * هیچ layout-ثابتی وجود ندارد.
     */
    categories: [
        {% for cat in catalog.categories_first_level %}
        {
            slug: "{{ cat.slug }}",
            title: "{{ cat.title }}",
            image: "{% if cat.image %}{{ cat.image.url }}{% endif %}",
            count: {{ cat.total_items }}
        },
        {% endfor %}
    ],


    /**
     * --------------------------------------------------------
     * searchUrl
     * --------------------------------------------------------
     * مسیر API جستجو در کاتالوگ.
     * فرانت با ارسال q=? به این endpoint نتایج را دریافت می‌کند.
     */
    searchUrl: "{% url 'api_catalog_search' catalog_slug=catalog.slug %}",


    /**
     * --------------------------------------------------------
     * itemsUrlTemplate
     * --------------------------------------------------------
     * الگوی دریافت آیتم‌های یک دسته.
     * در JS مقدار __CAT__ با slug دسته جایگزین می‌شود.
     *
     * مثال:
     *  /menu/cafe/drinks/  ← slug = drinks
     *
     * این الگو باعث می‌شود سیستم TECU:
     *   - وابسته به مسیرهای ثابت نباشد
     *   - multi‑catalog و multi‑tenant باشد
     */
    itemsUrlTemplate: "{% url 'api_category_items' catalog_slug=catalog.slug category_slug='__CAT__' %}"
}
</script>

<!-- ============================================================
     TECU MENU ENGINE LOADER
     ------------------------------------------------------------
     فایل اصلی JS که کل رفتار فرانت منو را مدیریت می‌کند:
     - دسته‌ها
     - سوایپ
     - ripple
     - جستجو
     - fetch از API
     - مدیریت Reactive State با Alpine.js
     ============================================================ -->
<script defer src="{% static 'tec/tecu/tecu_menu.js' %}"></script>
