{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="transparent" />
    <title>{% block title %}{{ catalog.title|default:"منوی دیجیتال" }}{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}{{ catalog.description|default:'کاتالوگ دیجیتال و منوی آنلاین با بهترین طراحی و رابط کاربری' }}{% endblock %}" />
    <meta name="keywords" content="منوی دیجیتال, کاتالوگ آنلاین, سفارش آنلاین, {{ catalog.title }}, رستوران" />
    <link rel="icon" type="image/svg+xml" href="{% if catalog and catalog.favicon %}{{ catalog.favicon.url }}{% else %}{% static 'icons/tecof_logo.png' %}{% endif %}" />
    <!-- OpenGraph -->
    <meta property="og:title" content="{{ catalog.title|default:'منوی دیجیتال' }}" />
    <meta property="og:description" content="{{ catalog.description|default:'کاتالوگ دیجیتال و منوی آنلاین' }}" />
    {% if catalog.cover %}
        <meta property="og:image" content="{{ catalog.cover.url }}" />
    {% endif %}
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ request.build_absolute_uri }}" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ catalog.title }}" />
    <meta name="twitter:description" content="{{ catalog.description }}" />
    {% if catalog.cover %}
        <meta name="twitter:image" content="{{ catalog.cover.url }}" />
    {% endif %}

    <!-- JSON-LD Schema.org -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Restaurant",
            "name": "{{ catalog.title }}",
            "image": "{% if catalog and catalog.logo %}{{ catalog.logo.url }}{% else %}""{% endif %}",
            "url": "{{ request.build_absolute_uri }}",
            "telephone": "{{ catalog.phone|default:'' }}",
            "address": {
                "@type": "PostalAddress",
                "streetAddress": "{{ catalog.address|default:'' }}"
            },
            "description": "{{ catalog.description|default:'' }}"
        }
    </script>

    <!-- Fonts preload / Styles -->
    <link rel="preload" href="{% static 'fonts/YekanBakh-Regular.woff2' %}" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="{% static 'fonts/YekanBakh-Bold.woff2' %}" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="{% static 'fonts/font-face.css' %}" />
    <!-- Scripts -->
    <script src="{% static 'js/alpinejs.js' %}" defer></script>
    <script src="{% static 'js/tailwindcss.js' %}"></script>

    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Vazirmatn', 'YekanBakh', system-ui, sans-serif;
        }
        @layer base {
            body { 
                margin: 0;
                padding: 0;
                font-family: var(--font-sans); 
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
            .scrollbar-hide::-webkit-scrollbar { display: none; }
            .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
            .touch-pan-x { touch-action: pan-x; }
            .touch-pan-y { touch-action: pan-y; }
        }
        @layer utilities {
            .pb-safe { padding-bottom:env(safe-area-inset-bottom); }
            .pt-safe { padding-top:env(safe-area-inset-top); }
            .h-screen-dvh { height: 100dvh; }
        }
        [x-cloak] { display: none !important; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
    {% block tecbody %}
        <body></body>
    {% endblock %}
</html>
