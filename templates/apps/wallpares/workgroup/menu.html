<div class="min-h-screen w-full font-sans bg-white" x-data="menuApp" dir="rtl">

    <!-- جستجو -->
    <div class="p-4">
        <input
            type="text"
            x-model="searchQuery"
            @input.debounce.250ms="handleSearch"
            placeholder="جستجوی شعبه..."
            class="w-full bg-slate-100 border border-slate-300 rounded-lg py-2 px-3 text-sm"
        >
    </div>

    <!-- دسته‌ها -->
    <div class="overflow-x-auto flex gap-3 px-4 py-2 border-b">
        <template x-for="cat in categories" :key="cat.slug">
            <button
                @click="selectCategory(cat.slug)"
                class="px-4 py-1 rounded-lg text-sm whitespace-nowrap"
                :class="activeCategory === cat.slug ? 'bg-black text-white' : 'bg-slate-100 text-slate-700'"
            >
                <span x-text="cat.title"></span>
            </button>
        </template>
    </div>

    <!-- لودینگ تار عنکبوتی -->
    <div x-show="isLoading" class="flex justify-center items-center py-20">
        <div class="relative w-20 h-20">
            <template x-for="i in 6">
                <div class="absolute top-1/2 left-1/2 w-2 h-2 bg-slate-400 rounded-full animate-ping"
                     :style="`transform: rotate(${i * 60}deg) translate(30px); animation-delay:${i * 100}ms;`"></div>
            </template>
        </div>
    </div>

    <!-- نتایج جستجو -->
    <div x-show="isSearching && !isLoading" class="p-4 space-y-3">
        <template x-if="!hasSearchResults()">
            <p class="text-slate-400 text-center text-sm py-10">هیچ شعبه‌ای پیدا نشد.</p>
        </template>

        <template x-for="group in searchResults">
            <div class="space-y-2">
                <template x-for="item in group.items">
                    <div class="border p-3 rounded-lg text-sm">
                        <span x-text="item.title"></span>
                    </div>
                </template>
            </div>
        </template>
    </div>

    <!-- آیتم‌های دسته -->
    <div x-show="!isSearching" class="p-4 space-y-3">
        <template x-for="item in items" :key="item.id">
            <div class="border px-3 py-2 rounded-lg text-sm">
                <span x-text="item.title"></span>
            </div>
        </template>
    </div>
</div>
