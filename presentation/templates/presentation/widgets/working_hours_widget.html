<!-- templates/presentation/widgets/working_hours_widget.html -->
<div x-data="workingHours('{{ name }}', {{ value|default:'{}'|safe }})" 
     class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 w-full">
    
    <template x-for="day in Object.keys(hours)" :key="day">
        <div class="bg-white border border-surface-200 rounded-2xl p-3 shadow-sm flex flex-col gap-2.5 transition-colors hover:border-surface-300">
            <!-- نام روز -->
            <div class="text-sm font-bold text-brand-700 text-right" x-text="day"></div>
            
            <!-- فیلدهای زمان -->
            <div class="flex items-center justify-between gap-2 bg-surface-50 p-1.5 rounded-xl border border-surface-100" dir="ltr">
                <input type="time" 
                       :name="`${name}_${day}_start`" 
                       x-model="hours[day][0]" 
                       class="w-full bg-transparent text-center text-sm font-nums text-brand-800 border-none focus:ring-0 p-0 outline-none cursor-text" />
                
                <span class="text-surface-400 text-xs font-bold">-</span>
                
                <input type="time" 
                       :name="`${name}_${day}_end`" 
                       x-model="hours[day][1]" 
                       class="w-full bg-transparent text-center text-sm font-nums text-brand-800 border-none focus:ring-0 p-0 outline-none cursor-text" />
            </div>
        </div>
    </template>
    
    <!-- اینپوت مخفی برای ارسال دیتای JSON به فرم جنگو -->
    <input type="hidden" :name="name" :value="JSON.stringify(hours)" />
</div>

<script>
function workingHours(name, initial) {
    // برای اطمینان از حفظ ترتیب روزهای هفته
    const defaultHours = {
        'شنبه': ['', ''],
        'یکشنبه': ['', ''],
        'دوشنبه': ['', ''],
        'سه‌شنبه': ['', ''],
        'چهارشنبه': ['', ''],
        'پنج‌شنبه': ['', ''],
        'جمعه': ['', ''],
    };

    return {
        name: name,
        hours: Object.assign(defaultHours, initial),
    }
}
</script>
