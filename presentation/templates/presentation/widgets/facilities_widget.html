<div 
    x-data="facilityWidget('{{ name }}', {{ value|safe|default:'{}' }})"
    class="w-full border border-gray-300 rounded-lg p-4 bg-white"
>

    <!-- Hidden JSON -->
    <input type="hidden" :name="inputName" x-model="jsonString">

    <!-- Items -->
    <template x-for="(item, index) in items" :key="index">
        <div class="flex items-center gap-2 mb-3">

            <input 
                type="text"
                x-model="item.key"
                @input="updateJSON()"
                placeholder="نام قابلیت"
                class="flex-1 px-3 py-2 border rounded-md focus:ring focus:ring-blue-200"
            />

            <input 
                type="text"
                x-model="item.value"
                @input="updateJSON()"
                placeholder="مقدار"
                class="flex-1 px-3 py-2 border rounded-md focus:ring focus:ring-blue-200"
            />

            <button 
                type="button"
                @click="remove(index)"
                class="px-2 py-2 bg-red-500 text-white rounded-md hover:bg-red-600"
            >
                ×
            </button>
        </div>
    </template>

    <!-- Add Button -->
    <button 
        type="button"
        @click="add()"
        class="mt-3 w-full py-2 bg-green-600 text-white rounded-md hover:bg-green-700"
    >
        افزودن قابلیت +
    </button>
</div>

<script>
function facilityWidget(name, initialValue) {
    return {
        inputName: name,
        items: Object.entries(initialValue || {}).map(([k, v]) => ({ key: k, value: v })),

        get jsonString() {
            const obj = {};
            this.items.forEach(i => { if(i.key.trim()) obj[i.key.trim()] = i.value.trim(); });
            return JSON.stringify(obj);
        },

        set jsonString(val) {},

        add() {
            this.items.push({ key: '', value: '' });
        },

        remove(index) {
            this.items.splice(index, 1);
        },

        updateJSON() {}
    };
}
</script>
