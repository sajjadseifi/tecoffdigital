<div class="django-file-widget w-full" id="widget-wrapper-{{ widget.attrs.id }}">
    
    <!-- فایل قبلی جنگو (در صورت ویرایش) -->
    {% if widget.value %}
    <div class="mb-5 p-3.5 bg-white border border-surface-200/70 rounded-2xl flex items-center justify-between shadow-[0_2px_10px_-4px_rgba(0,0,0,0.05)] transition-all hover:shadow-md hover:border-surface-300">
        <div class="flex items-center gap-4 overflow-hidden">
            <div class="p-2.5 bg-surface-50 text-brand-500 rounded-xl border border-surface-100">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
            </div>
            <div class="truncate" dir="ltr">
                <p class="text-[10px] text-brand-400 font-medium mb-0.5 text-right tracking-wider">فایل ذخیره شده</p>
                <a href="{{ widget.value.url }}" target="_blank" class="text-sm font-semibold text-brand-700 hover:text-accent-500 truncate block transition-colors">
                    {{ widget.value }}
                </a>
            </div>
        </div>
        
        {% if widget.is_clearable %}
        <label class="flex items-center gap-1.5 cursor-pointer bg-white hover:bg-rose-50 border border-surface-200 hover:border-rose-200 text-rose-500 px-3 py-2 rounded-xl transition-all duration-300">
            <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}" class="w-4 h-4 text-rose-500 rounded border-surface-300 focus:ring-rose-500 focus:ring-offset-0 cursor-pointer transition-colors">
            <span class="text-xs font-medium pt-0.5">حذف</span>
        </label>
        {% endif %}
    </div>
    {% endif %}

    <div class="relative  w-full bg-white rounded-3xl border border-surface-200/70 shadow-[0_2px_15px_-3px_rgba(0,0,0,0.03)] overflow-hidden transition-all duration-500 hover:shadow-[0_8px_30px_-4px_rgba(0,0,0,0.06)] p-3">
        
        <!-- Input مخفی جنگو -->
        <input type="{{ widget.type }}" name="{{ widget.name }}" id="{{ widget.attrs.id }}"
               class="hidden real-file-input {% if widget.attrs.class %}{{ widget.attrs.class }}{% endif %}"
               {% for name, value in widget.attrs.items %}
                   {% if value is not False and name != 'id' and name != 'class' %} 
                       {{ name }}{% if value is not True %}="{{ value }}"{% endif %}
                   {% endif %}
               {% endfor %} 
               onchange="window.handleWidgetFileSelection(this)" />

        <!-- 1. محیط Dropzone (حالت اولیه) -->
        <label for="{{ widget.attrs.id }}" class="dropzone-area flex flex-col items-center justify-center w-full min-h-[200px] bg-white hover:bg-surface-50/50 border-2 border-dashed border-surface-200 hover:border-accent-300 transition-all duration-300 cursor-pointer group p-8 rounded-[22px]">
            <div class="w-16 h-16 mb-5 rounded-2xl bg-surface-50 border border-surface-100 shadow-sm flex items-center justify-center text-brand-400 group-hover:text-accent-500 group-hover:bg-accent-50 group-hover:border-accent-100 group-hover:scale-110 transition-all duration-500 ease-out">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v16m8-8H4"></path></svg>
            </div>
            <p class="mb-2 text-sm text-brand-700 font-semibold tracking-wide">آپلود فایل جدید</p>
            <p class="text-xs text-brand-400 font-medium">کلیک کنید یا فایل را اینجا رها کنید</p>
        </label>

        <!-- 2. محیط برش عکس (Cropper) -->
        <div class="cropper-area hidden flex-col w-full bg-surface-50">
            <div class="w-full h-[320px] relative bg-brand-900 overflow-hidden">
                <img src="" class="cropper-image block max-w-full" alt="Picture">
            </div>
            <div class="p-4 flex items-center justify-between bg-white border-t border-surface-100">
                <button type="button" onclick="window.cancelCrop(this)" class="px-5 py-2.5 text-sm font-medium text-brand-500 hover:text-brand-700 bg-surface-100 hover:bg-surface-200 rounded-xl transition-colors">
                    انصراف
                </button>
                <button type="button" onclick="window.applyCrop(this)" class="px-6 py-2.5 text-sm font-medium text-white bg-accent-500 hover:bg-accent-600 rounded-xl shadow-[0_4px_12px_rgba(var(--color-accent-500),0.3)] hover:shadow-[0_6px_16px_rgba(var(--color-accent-500),0.4)] transition-all duration-300">
                    تایید و برش عکس
                </button>
            </div>
        </div>

        <!-- 3. محیط پیش‌نمایش نهایی (Preview) -->
        <div class="preview-area hidden w-full p-2">
            <div class="flex items-center gap-4 bg-white p-3.5 rounded-2xl border border-surface-100 shadow-sm">
                
                <!-- پیش‌نمایش عکس نهایی -->
                <div class="image-preview-container hidden w-14 h-14 rounded-xl overflow-hidden shadow-sm flex-shrink-0 bg-surface-50 border border-surface-200">
                    <img src="" class="w-full h-full object-cover preview-image transition-transform duration-500 hover:scale-110" alt="Preview">
                </div>
                
                <!-- پیش‌نمایش آیکون فایل معمولی -->
                <div class="file-icon-container hidden w-14 h-14 rounded-xl flex items-center justify-center text-accent-500 bg-accent-50/50 flex-shrink-0 border border-accent-100/50">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>

                <!-- اطلاعات فایل -->
                <div class="flex-1 min-w-0" dir="ltr">
                    <p class="text-sm font-semibold text-brand-700 truncate text-right file-name-text">نام فایل</p>
                    <p class="text-[11px] text-brand-400 mt-1 text-right font-nums file-size-text">حجم فایل</p>
                </div>

                <!-- دکمه حذف -->
                <button type="button" onclick="window.clearWidgetFile(this)" class="p-2.5 text-surface-400 hover:text-rose-500 hover:bg-rose-50 rounded-xl transition-all duration-300 flex-shrink-0" title="حذف فایل">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            </div>
        </div>
    </div>
</div>
