    <!-- ========================================== -->
    <!-- نمای ۳: تایید کد پیامکی -->
    <!-- ========================================== -->
    <div id="view-otp-verify" class="absolute inset-0 p-6 sm:p-8 flex flex-col transition-all duration-300 ease-in-out opacity-0 translate-x-8 pointer-events-none" style="display: none;">
      <div class="text-center mb-6 mt-2">
        <h2 class="text-2xl font-bold text-brand-900 mb-2">کد تایید</h2>
        <p class="text-sm text-brand-500 flex items-center justify-center gap-2 flex-wrap">
          <span>کد ۵ رقمی به</span>
          <span id="display-id-verify" class="font-bold text-brand-800" dir="ltr"></span>
          <span>ارسال شد.</span>
        </p>
        <button type="button" onclick="switchView('view-otp-verify', 'view-otp-request')" class="text-xs font-bold text-accent-600 hover:text-accent-500 mt-2 transition-colors inline-flex items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3 h-3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" />
          </svg>ویرایش شماره
        </button>
      </div>

      <form action="{% url 'auth_otp_verify' %}" method="POST" class="space-y-6 flex-1">
        {% csrf_token %}
        <input type="hidden" id="hidden-id-verify" name="identifier" value="" />

        <div>
          <input type="text" name="otp_code" dir="ltr" maxlength="5" placeholder="" class="w-full px-4 py-2 rounded-xl border border-surface-200 bg-surface-50 text-center text-3xl tracking-[1em] text-brand-900 font-bold focus:bg-white focus:outline-none focus:ring-2 focus:ring-accent-500 transition-all" required />
        </div>

        <button type="submit" class="w-full bg-brand-900 hover:bg-brand-800 text-white font-bold text-lg py-3 rounded-xl transition-all transform hover:-translate-y-0.5 focus:ring-4 focus:ring-surface-200">بررسی</button>
      </form>

      <div class="mt-6 text-center pt-6 border-t border-surface-200 h-[60px] flex items-center justify-center">
        <!-- بخش تایمر -->
        <p id="timer-container" class="text-sm text-brand-500 font-semibold" dir="ltr" style="display: none;">
          <span id="timer-text" class="text-brand-800"></span> <span class="mr-1">تا ارسال مجدد</span>
        </p>

        <!-- دکمه ارسال مجدد -->
        <button id="btn-resend-otp" type="button" class="text-sm font-bold text-accent-600 hover:text-accent-500 transition-colors disabled:opacity-50" style="display: none;">
          <span id="text-resend-otp">ارسال مجدد کد تایید</span>
          <span id="loading-resend-otp" style="display: none;">در حال ارسال...</span>
        </button>
      </div>
    </div>
