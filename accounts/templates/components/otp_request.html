    <!-- نمای ۲: دریافت شماره برای OTP -->
    <!-- ========================================== -->
    <div id="view-otp-request" class="absolute inset-0 p-6 sm:p-8 flex flex-col transition-all duration-300 ease-in-out opacity-0 translate-x-8 pointer-events-none" style="display: none;">
      <div class="text-center mb-8 mt-2">
        <h2 class="text-2xl font-bold text-brand-900 mb-2">ورود با پیامک</h2>
        <p class="text-sm text-brand-500">شماره موبایل خود را وارد کنید تا کد تایید ارسال شود.</p>
      </div>

      <form id="form-otp-request" class="space-y-5 flex-1 flex flex-col">
        <div>
          <label for="input-id-otp" class="block text-sm font-semibold text-brand-800 mb-2">شماره موبایل</label>
          <input type="tel" id="input-id-otp" dir="ltr" placeholder="0912***" class="w-full px-4 py-3 rounded-xl border border-surface-200 bg-surface-50 text-left text-brand-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-accent-500 transition-all placeholder:text-brand-300" required />
        </div>
        <div class="flex-1">
        </div>
        <button type="submit" id="btn-request-otp" class="w-full bg-accent-600 hover:bg-accent-500 text-white font-bold text-lg py-3 rounded-xl shadow-glow transition-all transform hover:-translate-y-0.5 focus:ring-4 focus:ring-accent-100 mt-4 flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
          <svg id="spinner-request-otp" style="display: none;" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>

          <span id="text-request-otp">دریافت کد تایید</span>
          <svg id="icon-request-otp" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 rtl:rotate-180">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
          </svg>
        </button>
      </form>

      <div class="mt-6 text-center pt-6 border-t border-surface-200">
        <button type="button" onclick="switchView('view-otp-request', 'view-password')" class="text-sm font-bold text-brand-600 hover:text-accent-600 transition-colors flex items-center justify-center gap-2 w-full">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
          </svg>بازگشت به ورود با رمز عبور
        </button>
      </div>
    </div>
