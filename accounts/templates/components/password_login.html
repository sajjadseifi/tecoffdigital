<div id="view-password" class="absolute inset-0 p-6 sm:p-8 flex flex-col transition-all duration-300 ease-in-out opacity-100 translate-y-0" style="display: flex;">
    <div class="text-center mb-8 mt-2">
    <h1 class="text-2xl font-bold text-brand-900 mb-2">ورود به حساب کاربری</h1>
    <p class="text-sm text-brand-500">جهت ورود، اطلاعات حساب خود را وارد کنید.</p>
    </div>

    <form action="{% url 'auth_sign_in' %}" method="POST" class="space-y-5 flex-1">
    {% csrf_token %}
    <div>
        <label for="input-id-pwd" class="block text-sm font-semibold text-brand-800 mb-2">شماره موبایل یا ایمیل</label>
        <input type="text" id="input-id-pwd" name="identifier" dir="ltr" placeholder="0912***" class="w-full px-4 py-3 rounded-xl border border-surface-200 bg-surface-50 text-left text-brand-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-accent-500 transition-all placeholder:text-brand-300" required />
    </div>

    <div>
        <div class="flex items-center justify-between mb-2">
        <label for="input-pwd" class="block text-sm font-semibold text-brand-800">رمز عبور</label>
        <a href="#" class="text-xs font-bold text-accent-600 hover:text-accent-500 transition-colors">فراموشی رمز؟</a>
        </div>
        <div class="relative">
        <input type="password" id="input-pwd" name="password" dir="ltr" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-surface-200 bg-surface-50 text-left text-brand-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-accent-500 transition-all placeholder:text-brand-300 pr-12" required />
        <button type="button" id="btn-toggle-pwd" class="absolute inset-y-0 right-0 px-4 flex items-center text-brand-400 hover:text-accent-500 focus:outline-none">
            <svg id="icon-eye-closed" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <svg id="icon-eye-open" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
        </button>
        </div>
    </div>

    <button type="submit" class="w-full bg-brand-900 hover:bg-brand-800 text-white font-bold text-lg py-3 rounded-xl transition-all transform hover:-translate-y-0.5 focus:ring-4 focus:ring-surface-200 mt-2">ورود | عضویت</button>
    </form>

    <div class="mt-6 pt-6 border-t border-surface-200">
    <button type="button" onclick="switchView('view-password', 'view-otp-request')" class="w-full py-3 rounded-xl border-2 border-surface-200 text-brand-700 font-bold text-sm hover:bg-surface-50 hover:border-surface-300 transition-all flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25c4.97 0 9-3.694 9-8.25s-4.03-8.25-9-8.25S3 7.444 3 12c0 2.104.859 4.023 2.273 5.48.432.447.74 1.04.586 1.641a4.483 4.483 0 01-.923 1.785A5.969 5.969 0 006 21c1.282 0 2.47-.402 3.445-1.087.81.22 1.668.337 2.555.337z" />
        </svg>ورود با کد یکبار مصرف (پیامک)
    </button>
    </div>
</div>
